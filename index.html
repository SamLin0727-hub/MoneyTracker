<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>帳本</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24 overflow-x-hidden relative" x-data="appData()" x-init="initApp()">

  <!-- 404 / 權限不足畫面 -->
  <div x-show="authStatus === 'forbidden'" class="fixed inset-0 z-[150] flex items-center justify-center bg-slate-900 p-4" x-cloak>
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 text-center space-y-4">
      <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
        <i class="fa-solid fa-ban"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-800">存取被拒絕</h2>
    </div>
  </div>

  <!-- 全螢幕 Locking Loading 遮罩 -->
  <div x-show="loading" 
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm pointer-events-auto select-none"
       x-cloak>
    <div class="bg-white/95 px-8 py-6 rounded-2xl shadow-2xl flex flex-col items-center justify-center gap-3 border border-slate-100 min-w-[180px]">
      <i class="fa-solid fa-circle-notch animate-spin text-emerald-600 text-3xl"></i>
      <span class="text-slate-700 font-bold text-sm tracking-wide" x-text="loadingText"></span>
    </div>
  </div>

  <!-- 中央置中 Toast 彈跳視窗訊息 -->
  <div x-show="toast.show" 
       x-transition:enter="transition ease-out duration-300 transform"
       x-transition:enter-start="opacity-0 scale-90"
       x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition ease-in duration-200 transform"
       x-transition:leave-start="opacity-100 scale-100"
       x-transition:leave-end="opacity-0 scale-90"
       class="fixed inset-0 z-[120] flex items-center justify-center p-4 pointer-events-none"
       x-cloak>
    <div class="flex items-center gap-3 px-6 py-3.5 rounded-2xl shadow-2xl text-white font-medium text-base pointer-events-auto backdrop-blur-md"
         :class="toast.type === 'danger' ? 'bg-rose-600/95 border border-rose-400/30' : (toast.type === 'info' ? 'bg-indigo-600/95 border border-indigo-400/30' : 'bg-emerald-600/95 border border-emerald-400/30')">
      <i :class="toast.type === 'danger' ? 'fa-solid fa-circle-exclamation text-lg' : (toast.type === 'info' ? 'fa-solid fa-circle-info text-lg' : 'fa-solid fa-circle-check text-lg')"></i>
      <span x-text="toast.message"></span>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <header class="bg-emerald-600 text-white shadow-md select-none">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <button type="button" @click="refreshApp()" class="flex items-center space-x-3 cursor-pointer hover:opacity-90 transition focus:outline-none">
        <i class="fa-solid fa-wallet text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide" x-text="'帳本 (' + currentUserName + ')'">帳本</h1>
      </button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-6xl mx-auto px-4 mt-6 space-y-6 w-full box-border">

    <div class="space-y-6 w-full">
      
      <!-- 紀錄展示區 -->
      <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200 w-full box-border overflow-hidden">
        
        <!-- 上方工具列 -->
        <div class="flex flex-col gap-3 mb-6 pb-4 border-b border-slate-100 w-full">
          
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 w-full">
            <div class="bg-slate-100 p-1 rounded-xl flex items-center space-x-1 w-full md:w-auto">
              <button @click="trackerSubView = 'list'" :class="trackerSubView === 'list' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 md:flex-none px-4 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-list"></i> 交易紀錄清單
              </button>
              <button @click="trackerSubView = 'summary'" :class="trackerSubView === 'summary' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 md:flex-none px-4 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-chart-bar"></i> 類別統計加總
              </button>
            </div>

            <div class="hidden md:flex items-center bg-slate-100 p-1 rounded-xl space-x-1 flex-shrink-0" x-show="trackerSubView === 'summary' && timeDimension === 'year'" x-cloak>
              <button @click="yearSummaryMode = 'category'" :class="yearSummaryMode === 'category' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="px-4 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-pie-chart"></i> 類別加總
              </button>
              <button @click="yearSummaryMode = 'monthly'" :class="yearSummaryMode === 'monthly' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="px-4 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-calendar-days"></i> 每月總覽
              </button>
            </div>

            <div class="hidden md:block w-64" x-show="trackerSubView === 'list'">
              <input type="text" x-model="searchQuery" placeholder="搜尋備註/類別..." class="w-full px-3 py-1.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
          </div>

          <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2 w-full md:w-auto">
            <div class="bg-slate-100 p-1 rounded-xl flex items-center space-x-1 w-full md:w-28 flex-shrink-0">
              <button @click="timeDimension = 'month'" :class="timeDimension === 'month' ? 'bg-emerald-600 text-white font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 py-1.5 md:py-1 text-center rounded-lg text-sm transition whitespace-nowrap">
                月
              </button>
              <button @click="timeDimension = 'year'" :class="timeDimension === 'year' ? 'bg-emerald-600 text-white font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 py-1.5 md:py-1 text-center rounded-lg text-sm transition whitespace-nowrap">
                年
              </button>
            </div>

            <div class="grid gap-2 w-full md:w-auto md:flex md:items-center" :class="timeDimension === 'month' ? 'grid-cols-2' : 'grid-cols-1'">
              
              <!-- 頂部篩選：年份按鈕 -->
              <div @click="openFilterYearModal()" class="flex items-center justify-between bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-100 w-full md:w-auto cursor-pointer hover:border-emerald-500 transition">
                <span class="text-xs font-semibold text-slate-500 whitespace-nowrap mr-1">年份：</span>
                <span class="font-bold text-emerald-700 text-sm whitespace-nowrap" x-text="selectedYear + '年'"></span>
              </div>

              <!-- 頂部篩選：月份按鈕 -->
              <div @click="openFilterMonthModal()" class="flex items-center justify-between bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-100 w-full md:w-auto cursor-pointer hover:border-emerald-500 transition" x-show="timeDimension === 'month'" x-cloak>
                <span class="text-xs font-semibold text-slate-500 whitespace-nowrap mr-1">月份：</span>
                <span class="font-bold text-emerald-700 text-sm whitespace-nowrap" x-text="parseInt(selectedMonth, 10) + '月'"></span>
              </div>

            </div>
          </div>

          <div class="flex md:hidden justify-center w-full pt-1" x-show="trackerSubView === 'summary' && timeDimension === 'year'" x-cloak>
            <div class="bg-slate-100 p-1 rounded-xl flex items-center space-x-1 w-full">
              <button @click="yearSummaryMode = 'category'" :class="yearSummaryMode === 'category' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-pie-chart"></i> 類別加總
              </button>
              <button @click="yearSummaryMode = 'monthly'" :class="yearSummaryMode === 'monthly' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-calendar-days"></i> 每月總覽
              </button>
            </div>
          </div>

          <div class="w-full md:hidden" x-show="trackerSubView === 'list'" style="height: 44px; padding-top: 0.25rem">
            <input type="text" x-model="searchQuery" placeholder="搜尋備註/類別..." class="w-full px-3 py-1.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
          </div>

          <!-- 收支金額顯示區 -->
          <div class="w-full pt-1">
            <div class="text-xs sm:text-sm font-semibold flex flex-col md:flex-row md:items-center justify-between md:justify-end gap-1.5 md:gap-6 w-full">
              <div class="flex items-center justify-between md:justify-start w-full md:w-auto">
                <span class="text-emerald-600" x-text="periodLabelText + '收入:'"></span>
                <span class="font-bold text-emerald-600 ml-2" x-text="'+$' + periodIncome.toLocaleString()"></span>
              </div>
              <div class="flex items-center justify-between md:justify-start w-full md:w-auto">
                <span class="text-rose-500" x-text="periodLabelText + '支出:'"></span>
                <span class="font-bold text-rose-500 ml-2" x-text="'-$' + periodExpense.toLocaleString()"></span>
              </div>
              <div class="flex items-center justify-between md:justify-start w-full md:w-auto">
                <span :class="periodNet >= 0 ? 'text-emerald-600' : 'text-rose-500'">本期結餘:</span>
                <span class="font-bold ml-2" :class="periodNet >= 0 ? 'text-emerald-600' : 'text-rose-500'" x-text="(periodNet >= 0 ? '+$' : '-$') + Math.abs(periodNet).toLocaleString()"></span>
              </div>
              <div class="flex items-center justify-between md:justify-start w-full md:w-auto">
                <span class="text-indigo-600">總結餘:</span>
                <span class="font-bold text-indigo-600 ml-2" x-text="(cumulativeTotal >= 0 ? '+$' : '-$') + Math.abs(cumulativeTotal).toLocaleString()"></span>
              </div>
            </div>
          </div>

        </div>

        <!-- 視圖 1：交易紀錄清單 -->
        <div x-show="trackerSubView === 'list'" class="divide-y divide-slate-100 w-full">
          <template x-for="item in filteredPeriodRecords" :key="item.id">
            <div class="py-3 flex justify-between items-center hover:bg-slate-50 px-1 sm:px-2 rounded-lg transition gap-2">
              <div class="flex items-center space-x-2 sm:space-x-3 min-w-0">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full flex-shrink-0 flex items-center justify-center text-sm font-bold" :class="getCategoryStyle(item.category).bgClass">
                  <i :class="getCategoryStyle(item.category).icon"></i>
                </div>
                <div class="min-w-0">
                  <div class="flex items-center space-x-1.5 sm:space-x-2 flex-wrap">
                    <span class="font-bold text-slate-800 text-sm sm:text-base truncate" x-text="item.category"></span>
                    <span class="text-[10px] sm:text-xs px-1.5 py-0.5 rounded text-slate-500 bg-slate-100 flex-shrink-0" x-text="formatDateStr(item.date)"></span>
                  </div>
                  <p class="text-xs text-slate-400 truncate" x-text="item.note || '無備註'"></p>
                </div>
              </div>

              <!-- 右側金額與下方小字註記 -->
              <div class="flex items-center space-x-2 sm:space-x-4 flex-shrink-0">
                <div class="text-right">
                  <div class="font-bold text-sm sm:text-base" :class="isExpense(item) ? 'text-rose-500' : 'text-emerald-600'" x-text="formatAmount(item)"></div>
                  <template x-if="item.currency && item.currency !== 'TWD'">
                    <div class="text-[10px] text-slate-400" x-text="item.currency + ' ' + Math.abs(Number(item.amount || 0))"></div>
                  </template>
                </div>
                <div class="flex space-x-1 text-slate-400">
                  <button @click="openEditModal(item)" :disabled="loading" class="p-1 sm:p-1.5 hover:text-indigo-600 rounded transition disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                </div>
              </div>
            </div>
          </template>
          
          <template x-if="filteredPeriodRecords.length === 0">
            <div class="text-center py-8 text-slate-400" x-text="periodLabelText + ' 無符合條件的交易紀錄'"></div>
          </template>
        </div>

        <!-- 視圖 2：統計分析 -->
        <div x-show="trackerSubView === 'summary'" class="space-y-6 py-2 w-full">

          <div x-show="timeDimension === 'month' || (timeDimension === 'year' && yearSummaryMode === 'category')" class="space-y-8">
            <div class="space-y-4 bg-emerald-50/40 p-4 rounded-xl border border-emerald-100">
              <h3 class="text-base font-bold text-emerald-700 flex items-center gap-2">
                <i class="fa-solid fa-arrow-up text-emerald-600"></i> 收入統計加總
              </h3>

              <template x-for="cat in incomeCategorySummaryList" :key="cat.category">
                <div class="space-y-1 w-full">
                  <div class="flex justify-between items-center text-sm">
                    <div class="flex items-center space-x-2">
                      <i :class="getCategoryStyle(cat.category).icon + ' ' + getCategoryStyle(cat.category).textClass"></i>
                      <span class="font-bold text-slate-700" x-text="cat.category"></span>
                    </div>
                    <div class="space-x-2">
                      <span class="text-xs text-slate-400" x-text="cat.percent + '%'"></span>
                      <span class="font-bold text-emerald-600" x-text="'+$' + cat.amount.toLocaleString()"></span>
                    </div>
                  </div>
                  <div class="w-full bg-emerald-100/60 rounded-full h-3 overflow-hidden">
                    <div class="h-3 rounded-full bg-emerald-500 transition-all duration-300" 
                         :style="'width: ' + cat.percent + '%'"></div>
                  </div>
                </div>
              </template>

              <template x-if="incomeCategorySummaryList.length === 0">
                <div class="text-center py-4 text-slate-400 text-sm" x-text="periodLabelText + ' 尚無收入紀錄'"></div>
              </template>
            </div>

            <div class="space-y-4 bg-rose-50/40 p-4 rounded-xl border border-rose-100">
              <h3 class="text-base font-bold text-rose-700 flex items-center gap-2">
                <i class="fa-solid fa-arrow-down text-rose-600"></i> 支出統計加總
              </h3>

              <template x-for="cat in expenseCategorySummaryList" :key="cat.category">
                <div class="space-y-1 w-full">
                  <div class="flex justify-between items-center text-sm">
                    <div class="flex items-center space-x-2">
                      <i :class="getCategoryStyle(cat.category).icon + ' ' + getCategoryStyle(cat.category).textClass"></i>
                      <span class="font-bold text-slate-700" x-text="cat.category"></span>
                    </div>
                    <div class="space-x-2">
                      <span class="text-xs text-slate-400" x-text="cat.percent + '%'"></span>
                      <span class="font-bold text-rose-500" x-text="'-$' + cat.amount.toLocaleString()"></span>
                    </div>
                  </div>
                  <div class="w-full bg-rose-100/60 rounded-full h-3 overflow-hidden">
                    <div class="h-3 rounded-full bg-rose-500 transition-all duration-300" 
                         :style="'width: ' + cat.percent + '%'"></div>
                  </div>
                </div>
              </template>

              <template x-if="expenseCategorySummaryList.length === 0">
                <div class="text-center py-4 text-slate-400 text-sm" x-text="periodLabelText + ' 尚無支出紀錄'"></div>
              </template>
            </div>
          </div>

          <div x-show="timeDimension === 'year' && yearSummaryMode === 'monthly'" class="space-y-4 bg-slate-50/80 p-4 rounded-xl border border-slate-200">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b border-slate-200/60 pb-3">
              <h3 class="text-base font-bold text-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-calendar-days text-emerald-600"></i> <span x-text="selectedYear + ' 年每月收支總覽'"></span>
              </h3>

              <!-- 篩選分類按鈕 -->
              <div @click="openFilterCategoryModal()" class="flex items-center justify-between bg-white px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm self-end sm:self-auto cursor-pointer hover:border-emerald-500 transition min-w-[150px]">
                <span class="text-xs font-semibold text-slate-500 whitespace-nowrap mr-1">篩選分類：</span>
                <span class="font-bold text-emerald-700 text-xs sm:text-sm whitespace-nowrap" x-text="monthlyFilterCategory === 'all' ? '全部類別' : monthlyFilterCategory"></span>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              <template x-for="mItem in monthlySummaryList" :key="mItem.month">
                <div class="p-3 bg-white rounded-lg border border-slate-200 shadow-sm flex flex-col justify-between hover:border-emerald-300 transition">
                  
                  <template x-if="monthlyFilterCategory === 'all'">
                    <div>
                      <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-slate-100">
                        <span class="font-bold text-slate-700" x-text="parseInt(mItem.month, 10) + ' 月'"></span>
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full" :class="mItem.net >= 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'" x-text="'結餘: ' + (mItem.net >= 0 ? '+' : '') + mItem.net.toLocaleString()"></span>
                      </div>
                      <div class="flex justify-between items-center text-xs space-x-1">
                        <span class="text-emerald-600 font-semibold" x-text="'收: +$' + mItem.income.toLocaleString()"></span>
                        <span class="text-rose-500 font-semibold" x-text="'支: -$' + mItem.expense.toLocaleString()"></span>
                      </div>
                    </div>
                  </template>

                  <template x-if="monthlyFilterCategory !== 'all'">
                    <div>
                      <div class="flex justify-between items-center mb-1 pb-1 border-b border-slate-100">
                        <span class="font-bold text-slate-700" x-text="parseInt(mItem.month, 10) + ' 月'"></span>
                        <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md" x-text="monthlyFilterCategory"></span>
                      </div>
                      <div class="flex justify-between items-center pt-1">
                        <span class="text-xs text-slate-400 font-medium">小計</span>
                        <span class="font-bold text-base" :class="mItem.total < 0 ? 'text-rose-500' : (mItem.total > 0 ? 'text-emerald-600' : 'text-slate-400')" x-text="(mItem.total > 0 ? '+$' : (mItem.total < 0 ? '-$' : '$')) + Math.abs(mItem.total).toLocaleString()"></span>
                      </div>
                    </div>
                  </template>

                </div>
              </template>
            </div>
          </div>

        </div>

      </div>
    </div>

  </main>

  <div class="fixed bottom-6 right-6 z-40">
    <button @click="openAddModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center transition-all transform hover:scale-105 active:scale-95">
      <i class="fa-solid fa-plus text-xl"></i>
    </button>
  </div>

  <!-- 編輯 / 新增共用 Modal 彈窗 -->
  <div x-show="showEditModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex justify-center items-center p-4 z-50" x-cloak>
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-5 sm:p-6 space-y-4 box-border relative max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-lg text-slate-700" x-text="isAddingNew ? '新增交易紀錄' : '編輯交易紀錄'"></h3>
        <div class="flex items-center space-x-2">
          <button type="button" @click="promptDeleteRecord()" :disabled="loading || isAddingNew" x-show="!isAddingNew" class="text-rose-400 hover:text-rose-600 p-1 disabled:opacity-50 transition" title="刪除此紀錄">
            <i class="fa-solid fa-trash text-base"></i>
          </button>
        </div>
      </div>

      <form @submit.prevent="handleModalSubmit" class="space-y-4 w-full">
        
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">收支類型</label>
          <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl w-full">
            <button type="button" @click="setEditFormType('expense')" :class="editForm.type === 'expense' ? 'bg-rose-500 text-white font-bold shadow' : 'text-slate-600'" class="py-1.5 rounded-lg text-xs font-semibold transition flex justify-center items-center gap-1.5">
              <i class="fa-solid fa-arrow-down"></i> 支出
            </button>
            <button type="button" @click="setEditFormType('income')" :class="editForm.type === 'income' ? 'bg-emerald-500 text-white font-bold shadow' : 'text-slate-600'" class="py-1.5 rounded-lg text-xs font-semibold transition flex justify-center items-center gap-1.5">
              <i class="fa-solid fa-arrow-up"></i> 收入
            </button>
          </div>
        </div>

        <!-- 日期欄位 -->
        <div class="w-full">
          <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>

        <button type="button" @click="calcAppendNumber('9')" class="bg-slate-50 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-100 transition">9</button>
        <button type="button" @click="calcAppendOperator('-')" class="bg-emerald-50 text-emerald-600 font-bold py-2.5 rounded-xl hover:bg-emerald-100 transition text-sm">-</button>

        <button type="button" @click="calcAppendNumber('4')" class="bg-slate-50 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-100 transition">4</button>
        <button type="button" @click="calcAppendNumber('5')" class="bg-slate-50 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-100 transition">5</button>
        <button type="button" @click="calcAppendNumber('6')" class="bg-slate-50 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-100 transition">6</button>
        <button type="button" @click="calcAppendOperator('+')" class="bg-emerald-50 text-emerald-600 font-bold py-2.5 rounded-xl hover:bg-emerald-100 transition text-sm">+</button>

        <button type="button" @click="calcAppendNumber('1')" class="bg-slate-50 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-100 transition">1</button>
        <button type="button" @click="calcAppendNumber('2')" class="bg-slate-50 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-100 transition">2</button>
        <button type="button" @click="calcAppendNumber('3')" class="bg-slate-50 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-100 transition">3</button>
        <button type="button" @click="calcCalculate()" class="bg-emerald-600 text-white font-bold py-2.5 row-span-2 rounded-xl hover:bg-emerald-700 transition flex items-center justify-center text-lg">=</button>

        <button type="button" @click="calcAppendNumber('0')" class="col-span-2 bg-slate-50 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-100 transition">0</button>
        <button type="button" @click="calcAppendNumber('.')" class="bg-slate-50 text-slate-700 font-bold py-2.5 rounded-xl hover:bg-slate-100 transition">.</button>
      </div>

      <div class="flex gap-2 pt-1">
        <button type="button" @click="showCalcModal = false" class="w-1/2 py-2 border border-slate-300 rounded-xl text-slate-600 font-semibold hover:bg-slate-50 transition text-sm">取消</button>
        <button type="button" @click="calcConfirm()" :disabled="!calcHasCalculated && calcExpression !== ''" class="w-1/2 py-2 bg-emerald-600 text-white rounded-xl font-semibold hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed transition text-sm">確定</button>
      </div>
    </div>
  </div>

  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
