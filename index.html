<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>個人記帳與財務分析</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [x-cloak] { display: none !important; }
    
    *, ::before, ::after {
      box-sizing: border-box !important;
    }

    input, select, button {
      font-size: 16px !important;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    .custom-select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%200d9488' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.5rem center;
      background-size: 1em;
      padding-right: 1.8rem !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24 overflow-x-hidden relative" x-data="appData()" x-init="initApp()">

  <!-- 全螢幕 Locking Loading 遮罩 -->
  <div x-show="loading" 
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm pointer-events-auto select-none"
       x-cloak>
    <div class="bg-white/95 px-8 py-6 rounded-2xl shadow-2xl flex flex-col items-center justify-center gap-3 border border-slate-100 min-w-[180px]">
      <i class="fa-solid fa-circle-notch animate-spin text-emerald-600 text-3xl"></i>
      <span class="text-slate-700 font-bold text-sm tracking-wide" x-text="loadingText"></span>
    </div>
  </div>

  <!-- 中央置中 Toast 彈跳視窗訊息 -->
  <div x-show="toast.show" 
       x-transition:enter="transition ease-out duration-300 transform"
       x-transition:enter-start="opacity-0 scale-90"
       x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition ease-in duration-200 transform"
       x-transition:leave-start="opacity-100 scale-100"
       x-transition:leave-end="opacity-0 scale-90"
       class="fixed inset-0 z-50 flex items-center justify-center p-4 pointer-events-none"
       x-cloak>
    <div class="flex items-center gap-3 px-6 py-3.5 rounded-2xl shadow-2xl text-white font-medium text-base pointer-events-auto backdrop-blur-md"
         :class="toast.type === 'danger' ? 'bg-rose-600/95 border border-rose-400/30' : (toast.type === 'info' ? 'bg-indigo-600/95 border border-indigo-400/30' : 'bg-emerald-600/95 border border-emerald-400/30')">
      <i :class="toast.type === 'danger' ? 'fa-solid fa-circle-exclamation text-lg' : (toast.type === 'info' ? 'fa-solid fa-circle-info text-lg' : 'fa-solid fa-circle-check text-lg')"></i>
      <span x-text="toast.message"></span>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <header class="bg-emerald-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-wallet text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">個人記帳與財務分析[cite: 1]</h1>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-6xl mx-auto px-4 mt-6 space-y-6 w-full box-border">

    <div class="space-y-6 w-full">
      
      <!-- 紀錄展示區 -->
      <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200 w-full box-border overflow-hidden">
        
        <!-- 上方工具列 -->
        <div class="flex flex-col gap-3 mb-6 pb-4 border-b border-slate-100 w-full">
          
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 w-full">
            <div class="bg-slate-100 p-1 rounded-xl flex items-center space-x-1 w-full md:w-auto">
              <button @click="trackerSubView = 'list'" :class="trackerSubView === 'list' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 md:flex-none px-4 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-list"></i> 交易紀錄清單
              </button>
              <button @click="trackerSubView = 'summary'" :class="trackerSubView === 'summary' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 md:flex-none px-4 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-chart-bar"></i> 類別統計加總
              </button>
            </div>

            <div class="hidden md:flex items-center bg-slate-100 p-1 rounded-xl space-x-1 flex-shrink-0" x-show="trackerSubView === 'summary' && timeDimension === 'year'" x-cloak>
              <button @click="yearSummaryMode = 'category'" :class="yearSummaryMode === 'category' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="px-4 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-pie-chart"></i> 類別加總
              </button>
              <button @click="yearSummaryMode = 'monthly'" :class="yearSummaryMode === 'monthly' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="px-4 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-calendar-days"></i> 每月總覽
              </button>
            </div>

            <div class="hidden md:block w-64" x-show="trackerSubView === 'list'">
              <input type="text" x-model="searchQuery" placeholder="搜尋備註/類別..." class="w-full px-3 py-1.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
          </div>

          <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2 w-full md:w-auto">
            <div class="bg-slate-100 p-1 rounded-xl flex items-center space-x-1 w-full md:w-28 flex-shrink-0">
              <button @click="timeDimension = 'month'" :class="timeDimension === 'month' ? 'bg-emerald-600 text-white font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 py-1.5 md:py-1 text-center rounded-lg text-sm transition whitespace-nowrap">
                月
              </button>
              <button @click="timeDimension = 'year'" :class="timeDimension === 'year' ? 'bg-emerald-600 text-white font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 py-1.5 md:py-1 text-center rounded-lg text-sm transition whitespace-nowrap">
                年
              </button>
            </div>

            <div class="grid gap-2 w-full md:w-auto md:flex md:items-center" :class="timeDimension === 'month' ? 'grid-cols-2' : 'grid-cols-1'">
              
              <div class="flex items-center bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-100 w-full md:w-auto">
                <span class="text-xs font-semibold text-slate-500 whitespace-nowrap mr-1">年份：</span>
                <select x-model="selectedYear" class="custom-select bg-transparent font-bold text-emerald-700 text-sm outline-none cursor-pointer w-full md:w-auto text-right md:text-left whitespace-nowrap">
                  <template x-for="y in availableYears" :key="y">
                    <option :value="y" x-text="y + '年'"></option>
                  </template>
                </select>
              </div>

              <div class="flex items-center bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-100 w-full md:w-auto" x-show="timeDimension === 'month'" x-cloak>
                <span class="text-xs font-semibold text-slate-500 whitespace-nowrap mr-1">月份：</span>
                <select x-model="selectedMonth" class="custom-select bg-transparent font-bold text-emerald-700 text-sm outline-none cursor-pointer w-full md:w-auto text-right md:text-left whitespace-nowrap">
                  <template x-for="m in monthOptions" :key="m">
                    <option :value="m" x-text="parseInt(m, 10) + '月'"></option>
                  </template>
                </select>
              </div>

            </div>
          </div>

          <div class="flex md:hidden justify-center w-full pt-1" x-show="trackerSubView === 'summary' && timeDimension === 'year'" x-cloak>
            <div class="bg-slate-100 p-1 rounded-xl flex items-center space-x-1 w-full">
              <button @click="yearSummaryMode = 'category'" :class="yearSummaryMode === 'category' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-pie-chart"></i> 類別加總
              </button>
              <button @click="yearSummaryMode = 'monthly'" :class="yearSummaryMode === 'monthly' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-calendar-days"></i> 每月總覽
              </button>
            </div>
          </div>

          <div class="w-full md:hidden" x-show="trackerSubView === 'list'" style="height: 44px; padding-top: 0.25rem">
            <input type="text" x-model="searchQuery" placeholder="搜尋備註/類別..." class="w-full px-3 py-1.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500">
          </div>

          <!-- 收支金額顯示區 -->
          <div class="w-full pt-1">
            <div class="text-xs sm:text-sm font-semibold flex flex-col md:flex-row md:items-center justify-between md:justify-end gap-1.5 md:gap-6 w-full">
              <div class="flex items-center justify-between md:justify-start w-full md:w-auto">
                <span class="text-emerald-600" x-text="periodLabelText + '收入:'"></span>
                <span class="font-bold text-emerald-600 ml-2" x-text="'+$' + periodIncome.toLocaleString()"></span>
              </div>
              <div class="flex items-center justify-between md:justify-start w-full md:w-auto">
                <span class="text-rose-500" x-text="periodLabelText + '支出:'"></span>
                <span class="font-bold text-rose-500 ml-2" x-text="'-$' + periodExpense.toLocaleString()"></span>
              </div>
              <div class="flex items-center justify-between md:justify-start w-full md:w-auto">
                <span :class="periodNet >= 0 ? 'text-emerald-600' : 'text-rose-500'">本期結餘:</span>
                <span class="font-bold ml-2" :class="periodNet >= 0 ? 'text-emerald-600' : 'text-rose-500'" x-text="(periodNet >= 0 ? '+$' : '-$') + Math.abs(periodNet).toLocaleString()"></span>
              </div>
              <div class="flex items-center justify-between md:justify-start w-full md:w-auto">
                <span class="text-indigo-600">總結餘:</span>
                <span class="font-bold text-indigo-600 ml-2" x-text="(cumulativeTotal >= 0 ? '+$' : '-$') + Math.abs(cumulativeTotal).toLocaleString()"></span>
              </div>
            </div>
          </div>

        </div>

        <!-- 視圖 1：交易紀錄清單 -->
        <div x-show="trackerSubView === 'list'" class="divide-y divide-slate-100 w-full">
          <template x-for="item in filteredPeriodRecords" :key="item.ID || item.id">
            <div class="py-3 flex justify-between items-center hover:bg-slate-50 px-1 sm:px-2 rounded-lg transition gap-2">
              <div class="flex items-center space-x-2 sm:space-x-3 min-w-0">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full flex-shrink-0 flex items-center justify-center text-sm font-bold" :class="getCategoryStyle(item.類別 || item.category).bgClass">
                  <i :class="getCategoryStyle(item.類別 || item.category).icon"></i>
                </div>
                <div class="min-w-0">
                  <div class="flex items-center space-x-1.5 sm:space-x-2 flex-wrap">
                    <span class="font-bold text-slate-800 text-sm sm:text-base truncate" x-text="item.類別 || item.category"></span>
                    <span class="text-[10px] sm:text-xs px-1.5 py-0.5 rounded text-slate-500 bg-slate-100 flex-shrink-0" x-text="formatDateStr(item.日期 || item.date)"></span>
                  </div>
                  <p class="text-xs text-slate-400 truncate" x-text="item.備註 || item.note || '無備註'"></p>
                </div>
              </div>

              <!-- 右側金額與下方小字註記 -->
              <div class="flex items-center space-x-2 sm:space-x-4 flex-shrink-0">
                <div class="text-right">
                  <div class="font-bold text-sm sm:text-base" :class="isExpense(item) ? 'text-rose-500' : 'text-emerald-600'" x-text="formatAmount(item)"></div>
                  <template x-if="(item.幣別 || item.currency) && (item.幣別 || item.currency) !== 'TWD'">
                    <div class="text-[10px] text-slate-400" x-text="(item.幣別 || item.currency) + ' ' + Math.abs(Number(item.金額 || item.amount || 0))"></div>
                  </template>
                </div>
                <div class="flex space-x-1 text-slate-400">
                  <button @click="openEditModal(item)" :disabled="loading" class="p-1 sm:p-1.5 hover:text-indigo-600 rounded transition disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                </div>
              </div>
            </div>
          </template>
          
          <template x-if="filteredPeriodRecords.length === 0">
            <div class="text-center py-8 text-slate-400" x-text="periodLabelText + ' 無符合條件的交易紀錄'"></div>
          </template>
        </div>

        <!-- 視圖 2：統計分析 -->
        <div x-show="trackerSubView === 'summary'" class="space-y-6 py-2 w-full">

          <div x-show="timeDimension === 'month' || (timeDimension === 'year' && yearSummaryMode === 'category')" class="space-y-8">
            <div class="space-y-4 bg-emerald-50/40 p-4 rounded-xl border border-emerald-100">
              <h3 class="text-base font-bold text-emerald-700 flex items-center gap-2">
                <i class="fa-solid fa-arrow-up text-emerald-600"></i> 收入統計加總
              </h3>

              <template x-for="cat in incomeCategorySummaryList" :key="cat.category">
                <div class="space-y-1 w-full">
                  <div class="flex justify-between items-center text-sm">
                    <div class="flex items-center space-x-2">
                      <i :class="getCategoryStyle(cat.category).icon + ' ' + getCategoryStyle(cat.category).textClass"></i>
                      <span class="font-bold text-slate-700" x-text="cat.category"></span>
                    </div>
                    <div class="space-x-2">
                      <span class="text-xs text-slate-400" x-text="cat.percent + '%'"></span>
                      <span class="font-bold text-emerald-600" x-text="'+$' + cat.amount.toLocaleString()"></span>
                    </div>
                  </div>
                  <div class="w-full bg-emerald-100/60 rounded-full h-3 overflow-hidden">
                    <div class="h-3 rounded-full bg-emerald-500 transition-all duration-300" 
                         :style="'width: ' + cat.percent + '%'"></div>
                  </div>
                </div>
              </template>

              <template x-if="incomeCategorySummaryList.length === 0">
                <div class="text-center py-4 text-slate-400 text-sm" x-text="periodLabelText + ' 尚無收入紀錄'"></div>
              </template>
            </div>

            <div class="space-y-4 bg-rose-50/40 p-4 rounded-xl border border-rose-100">
              <h3 class="text-base font-bold text-rose-700 flex items-center gap-2">
                <i class="fa-solid fa-arrow-down text-rose-600"></i> 支出統計加總
              </h3>

              <template x-for="cat in expenseCategorySummaryList" :key="cat.category">
                <div class="space-y-1 w-full">
                  <div class="flex justify-between items-center text-sm">
                    <div class="flex items-center space-x-2">
                      <i :class="getCategoryStyle(cat.category).icon + ' ' + getCategoryStyle(cat.category).textClass"></i>
                      <span class="font-bold text-slate-700" x-text="cat.category"></span>
                    </div>
                    <div class="space-x-2">
                      <span class="text-xs text-slate-400" x-text="cat.percent + '%'"></span>
                      <span class="font-bold text-rose-500" x-text="'-$' + cat.amount.toLocaleString()"></span>
                    </div>
                  </div>
                  <div class="w-full bg-rose-100/60 rounded-full h-3 overflow-hidden">
                    <div class="h-3 rounded-full bg-rose-500 transition-all duration-300" 
                         :style="'width: ' + cat.percent + '%'"></div>
                  </div>
                </div>
              </template>

              <template x-if="expenseCategorySummaryList.length === 0">
                <div class="text-center py-4 text-slate-400 text-sm" x-text="periodLabelText + ' 尚無支出紀錄'"></div>
              </template>
            </div>
          </div>

          <div x-show="timeDimension === 'year' && yearSummaryMode === 'monthly'" class="space-y-4 bg-slate-50/80 p-4 rounded-xl border border-slate-200">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b border-slate-200/60 pb-3">
              <h3 class="text-base font-bold text-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-calendar-days text-emerald-600"></i> <span x-text="selectedYear + ' 年每月收支總覽'"></span>
              </h3>

              <div class="flex items-center bg-white px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm self-end sm:self-auto">
                <span class="text-xs font-semibold text-slate-500 whitespace-nowrap mr-1">篩選分類：</span>
                <select x-model="monthlyFilterCategory" class="custom-select bg-transparent font-bold text-emerald-700 text-xs sm:text-sm outline-none cursor-pointer">
                  <option value="all">全部類別</option>
                  <optgroup label="支出類別">
                    <template x-for="cat in expenseCategories" :key="'m-exp-' + cat">
                      <option :value="cat" x-text="cat"></option>
                    </template>
                  </optgroup>
                  <optgroup label="收入類別">
                    <template x-for="cat in incomeCategories" :key="'m-inc-' + cat">
                      <option :value="cat" x-text="cat"></option>
                    </template>
                  </optgroup>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              <template x-for="mItem in monthlySummaryList" :key="mItem.month">
                <div class="p-3 bg-white rounded-lg border border-slate-200 shadow-sm flex flex-col justify-between hover:border-emerald-300 transition">
                  
                  <template x-if="monthlyFilterCategory === 'all'">
                    <div>
                      <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-slate-100">
                        <span class="font-bold text-slate-700" x-text="parseInt(mItem.month, 10) + ' 月'"></span>
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full" :class="mItem.net >= 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'" x-text="'結餘: ' + (mItem.net >= 0 ? '+' : '') + mItem.net.toLocaleString()"></span>
                      </div>
                      <div class="flex justify-between items-center text-xs space-x-1">
                        <span class="text-emerald-600 font-semibold" x-text="'收: +$' + mItem.income.toLocaleString()"></span>
                        <span class="text-rose-500 font-semibold" x-text="'支: -$' + mItem.expense.toLocaleString()"></span>
                      </div>
                    </div>
                  </template>

                  <template x-if="monthlyFilterCategory !== 'all'">
                    <div>
                      <div class="flex justify-between items-center mb-1 pb-1 border-b border-slate-100">
                        <span class="font-bold text-slate-700" x-text="parseInt(mItem.month, 10) + ' 月'"></span>
                        <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md" x-text="monthlyFilterCategory"></span>
                      </div>
                      <div class="flex justify-between items-center pt-1">
                        <span class="text-xs text-slate-400 font-medium">小計</span>
                        <span class="font-bold text-base" :class="mItem.total < 0 ? 'text-rose-500' : (mItem.total > 0 ? 'text-emerald-600' : 'text-slate-400')" x-text="(mItem.total > 0 ? '+$' : (mItem.total < 0 ? '-$' : '$')) + Math.abs(mItem.total).toLocaleString()"></span>
                      </div>
                    </div>
                  </template>

                </div>
              </template>
            </div>
          </div>

        </div>

      </div>
    </div>

  </main>

  <div class="fixed bottom-6 right-6 z-40">
    <button @click="openAddModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center transition-all transform hover:scale-105 active:scale-95">
      <i class="fa-solid fa-plus text-xl"></i>
    </button>
  </div>

  <!-- 編輯 / 新增共用 Modal 彈窗 -->
  <div x-show="showEditModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex justify-center items-center p-4 z-50" x-cloak>
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-5 sm:p-6 space-y-4 box-border relative max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-lg text-slate-700" x-text="isAddingNew ? '新增交易紀錄' : '編輯交易紀錄'"></h3>
        <div class="flex items-center space-x-2">
          <button type="button" @click="promptDeleteRecord()" :disabled="loading || isAddingNew" x-show="!isAddingNew" class="text-rose-400 hover:text-rose-600 p-1 disabled:opacity-50 transition" title="刪除此紀錄">
            <i class="fa-solid fa-trash text-base"></i>
          </button>
        </div>
      </div>

      <form @submit.prevent="handleModalSubmit" class="space-y-4 w-full">
        
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">收支類型</label>
          <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl w-full">
            <button type="button" @click="setEditFormType('expense')" :class="editForm.type === 'expense' ? 'bg-rose-500 text-white font-bold shadow' : 'text-slate-600'" class="py-1.5 rounded-lg text-xs font-semibold transition flex justify-center items-center gap-1.5">

  <script>

      const currentMonthStr = String(now.getMonth() + 1).padStart(2, '0');
      const currentDayStr = String(now.getDate()).padStart(2, '0');

      return {
        trackerSubView: 'list',
        timeDimension: 'month',
        yearSummaryMode: 'category',
        monthlyFilterCategory: 'all',
        
        selectedYear: currentYearStr,
        selectedMonth: currentMonthStr,
        
        webAppUrl: 'https://script.google.com/macros/s/AKfycbwxyqVeM-LHKa1dIa2JF9H0xF7xCvhyUdpMdeiyk4JIri4y8qqKKFQ-cRuVmuYQ7w5rLQ/exec',

        incomeCategories: ['薪水', '兼職', '獎金', '紅包', '中獎'],
        expenseCategories: ['飲食', '住家', '交通', '購物', '醫療', '旅遊', 'Pet麻糬', '電信費', '電費', '水費', '瓦斯費', '手續費', '娛樂'],
        currencyOptions: ['TWD', 'USD', 'JPY', 'EUR', 'CNY', 'HKD', 'GBP', 'AUD', 'KRW'],
        
        categoryStyles: {
          '飲食': { icon: 'fa-solid fa-utensils', bgClass: 'bg-amber-100 text-amber-600', textClass: 'text-amber-500' },
          '住家': { icon: 'fa-solid fa-house', bgClass: 'bg-indigo-100 text-indigo-600', textClass: 'text-indigo-500' },
          '交通': { icon: 'fa-solid fa-car', bgClass: 'bg-blue-100 text-blue-600', textClass: 'text-blue-500' },
          '購物': { icon: 'fa-solid fa-bag-shopping', bgClass: 'bg-pink-100 text-pink-600', textClass: 'text-pink-500' },
          '醫療': { icon: 'fa-solid fa-notes-medical', bgClass: 'bg-red-100 text-red-600', textClass: 'text-red-500' },
          '旅遊': { icon: 'fa-solid fa-plane', bgClass: 'bg-sky-100 text-sky-600', textClass: 'text-sky-500' },
          'Pet麻糬': { icon: 'fa-solid fa-carrot', bgClass: 'bg-orange-100 text-orange-600', textClass: 'text-orange-500' },
          '電信費': { icon: 'fa-solid fa-mobile-screen-button', bgClass: 'bg-cyan-100 text-cyan-600', textClass: 'text-cyan-500' },
          '電費': { icon: 'fa-solid fa-bolt', bgClass: 'bg-yellow-100 text-yellow-600', textClass: 'text-yellow-500' },
          '水費': { icon: 'fa-solid fa-droplet', bgClass: 'bg-teal-100 text-teal-600', textClass: 'text-teal-500' },
          '瓦斯費': { icon: 'fa-solid fa-fire', bgClass: 'bg-rose-100 text-rose-600', textClass: 'text-rose-500' },
          '手續費': { icon: 'fa-solid fa-receipt', bgClass: 'bg-slate-200 text-slate-700', textClass: 'text-slate-600' },
          '娛樂': { icon: 'fa-solid fa-gamepad', bgClass: 'bg-purple-100 text-purple-600', textClass: 'text-purple-500' },
          '薪水': { icon: 'fa-solid fa-money-bill-wave', bgClass: 'bg-emerald-100 text-emerald-600', textClass: 'text-emerald-500' },
          '兼職': { icon: 'fa-solid fa-briefcase', bgClass: 'bg-green-100 text-green-600', textClass: 'text-green-500' },
          '獎金': { icon: 'fa-solid fa-trophy', bgClass: 'bg-yellow-100 text-yellow-600', textClass: 'text-yellow-500' },
          '紅包': { icon: 'fa-solid fa-envelope-open-text', bgClass: 'bg-red-100 text-red-600', textClass: 'text-red-500' },
          '中獎': { icon: 'fa-solid fa-gift', bgClass: 'bg-fuchsia-100 text-fuchsia-600', textClass: 'text-fuchsia-500' }
        },

        monthOptions: ['01','02','03','04','05','06','07','08','09','10','11','12'],
        
        // 彈跳視窗狀態
        showDatePickerModal: false,
        pickerMode: 'day',
        pickerYear: currentYearStr,
        pickerMonth: currentMonthStr,
        pickerDay: currentDayStr,
        pickerSelectedDateStr: `${currentYearStr}-${currentMonthStr}-${currentDayStr}`,

        showCategoryPickerModal: false,
        showCurrencyPickerModal: false,

        openCategoryPickerModal() {
          this.showCategoryPickerModal = true;
        },

        selectCategory(cat) {
          this.editForm.category = cat;
          this.showCategoryPickerModal = false;
        },

        openCurrencyPickerModal() {
          this.showCurrencyPickerModal = true;
        },

        selectCurrency(cur) {
          this.editForm.currency = cur;
          if (cur === 'TWD') {
            this.editForm.exchangeRate = 1;
          }
          this.showCurrencyPickerModal = false;
        },

        get pickerCurrentYearStr() {
          return new Date().getFullYear().toString();
        },

        get pickerPrev3Years() {
          const cy = new Date().getFullYear();
          return [String(cy - 3), String(cy - 2), String(cy - 1)];
        },

        get pickerNext3Years() {
          const cy = new Date().getFullYear();
          return [String(cy + 1), String(cy + 2), String(cy + 3)];
        },

        get pickerCalendarCells() {
          const y = parseInt(this.pickerYear, 10);
          const m = parseInt(this.pickerMonth, 10);
          const firstDayIndex = new Date(y, m - 1, 1).getDay();
          const totalDays = new Date(y, m, 0).getDate();

          const cells = [];
          for (let i = 0; i < firstDayIndex; i++) {
            cells.push({ key: 'p-empty-' + i, day: null, dateStr: '' });
          }
          for (let d = 1; d <= totalDays; d++) {
            const dStr = String(d).padStart(2, '0');
            cells.push({
              key: 'p-day-' + d,
              day: dStr,
              dateStr: `${this.pickerYear}-${this.pickerMonth}-${dStr}`
            });
          }
          return cells;
        },

        openDatePickerModal() {
          const parts = this.editForm.date.split('-');
          if (parts.length === 3) {
            this.pickerYear = parts[0];
            this.pickerMonth = parts[1];
            this.pickerDay = parts[2];
          }
          this.pickerSelectedDateStr = this.editForm.date;
          this.pickerMode = 'day';
          this.showDatePickerModal = true;
        },

        selectPickerYear(y) {
          this.pickerYear = y;
          this.pickerMode = 'month';
        },

        selectPickerMonth(m) {
          this.pickerMonth = m;
          this.pickerMode = 'day';
          this.updatePickerDaysCount();
        },

        pickerChangeMonthOffset(offset) {
          let mNum = parseInt(this.pickerMonth, 10) + offset;
          let yNum = parseInt(this.pickerYear, 10);
          if (mNum > 12) {
            mNum = 1;
            yNum++;
          } else if (mNum < 1) {
            mNum = 12;
            yNum--;
          }
          this.pickerYear = String(yNum);
          this.pickerMonth = String(mNum).padStart(2, '0');
          this.updatePickerDaysCount();
        },

        updatePickerDaysCount() {
          const y = parseInt(this.pickerYear, 10);
          const m = parseInt(this.pickerMonth, 10);
          const totalDays = new Date(y, m, 0).getDate();
          let dNum = parseInt(this.pickerDay, 10);
          if (isNaN(dNum) || dNum > totalDays) {
            dNum = totalDays;
          }
          this.pickerDay = String(dNum).padStart(2, '0');
          this.pickerSelectedDateStr = `${this.pickerYear}-${this.pickerMonth}-${this.pickerDay}`;
        },

        selectPickerDay(dayStr) {
          this.pickerDay = dayStr;
          this.pickerSelectedDateStr = `${this.pickerYear}-${this.pickerMonth}-${this.pickerDay}`;
          this.confirmDatePicker();
        },

        confirmDatePicker() {
          this.editForm.date = this.pickerSelectedDateStr;
          this.showDatePickerModal = false;
        },

        showEditModal: false,
        showConfirmModal: false,
        isAddingNew: false,
        editForm: { 
          id: '', 
          type: 'expense', 
          date: `${currentYearStr}-${currentMonthStr}-${currentDayStr}`, 
          category: '飲食', 
          amount: '', 
          currency: 'TWD',
          exchangeRate: 1,
          note: '' 
        },

        showCalcModal: false,
        calcDisplay: '0',
        calcExpression: '',
        calcResetNext: false,
        calcHasCalculated: true,

        records: [],
        loading: false,
        loadingText: '處理中...',

        toast: { show: false, message: '', type: 'success' },
        showToast(message, type = 'success') {
          this.toast.message = message;
          this.toast.type = type;
          this.toast.show = true;
          setTimeout(() => {
            this.toast.show = false;
          }, 3000);
        },

        async initApp() {
          await this.loadAllYearsData();
        },

        async loadAllYearsData() {
          this.loadingText = '資料載入中...';
          this.loading = true;
          let allRecords = [];
          const cy = new Date().getFullYear();

          try {
            for (let y = 2023; y <= cy + 3; y++) {
              try {
                const res = await fetch(`${this.webAppUrl}?action=getData&year=${y}`);
                const data = await res.json();
                if (data && data.data && data.data.length > 0) {
                  allRecords = allRecords.concat(data.data);
                }
              } catch (err) {}
            }
            this.records = allRecords;
          } catch (e) {
            console.error('整體載入失敗', e);
          } finally {
            this.loading = false;
          }

          if (this.availableYears.length > 0 && !this.availableYears.includes(this.selectedYear)) {
            this.selectedYear = this.availableYears[0];
          }
        },

        getCategoryStyle(category) {
          return this.categoryStyles[category] || {
            icon: 'fa-solid fa-tags',
            bgClass: 'bg-slate-100 text-slate-600',
            textClass: 'text-slate-500'
          };
        },

        formatDateStr(str) {
          if (!str) return '';
          let cleanStr = String(str);
          if (cleanStr.includes('T')) {
            cleanStr = cleanStr.split('T')[0];
          }
          return cleanStr.substring(0, 10);
        },

        get availableYears() {
          const yearsSet = new Set();
          
          this.records.forEach(r => {
            const dateStr = this.formatDateStr(r.日期 || r.date);
            if (dateStr && dateStr.length >= 4) {
              const yStr = dateStr.substring(0, 4);
              const yNum = parseInt(yStr, 10);
              if (!isNaN(yNum) && yNum >= 2023) {
                yearsSet.add(yStr);
              }
            }
          });

          const nowY = String(new Date().getFullYear());
          if (yearsSet.size === 0) {
            yearsSet.add(nowY);
          }

          return Array.from(yearsSet).sort((a, b) => b.localeCompare(a));
        },

        get periodLabelText() {
          if (this.timeDimension === 'month') {
            return `${this.selectedYear}年${parseInt(this.selectedMonth, 10)}月`;
          } else {
            return `${this.selectedYear}年`;
          }
        },

        get currentFilterPrefix() {
          if (this.timeDimension === 'month') {
            return `${this.selectedYear}-${this.selectedMonth}`;
          } else {
            return `${this.selectedYear}`;
          }
        },

        get editCategories() {
          return this.editForm.type === 'expense' ? this.expenseCategories : this.incomeCategories;
        },

        setEditFormType(type) {
          this.editForm.type = type;
          const cats = type === 'expense' ? this.expenseCategories : this.incomeCategories;
          if (!cats.includes(this.editForm.category)) {
            this.editForm.category = cats[0];
          }
        },

        isExpense(item) {
          const type = item.類型 || item.type;
          const amt = Number(item.金額 || item.amount || 0);
          return type === 'expense' || amt < 0;
        },

        getConvertedAmount(item) {
          const rawAmt = Math.abs(Number(item.金額 || item.amount || 0));
          const rate = Number(item.匯率 || item.exchangeRate || 1);
          return Math.round(rawAmt * rate);
        },

        formatAmount(item) {
          const converted = this.getConvertedAmount(item);
          return (this.isExpense(item) ? '-$' : '+$') + converted.toLocaleString();
        },

        get periodRecords() {
          const prefix = this.currentFilterPrefix;
          if (!prefix) return [];

          return this.records.filter(r => {
            const dateStr = this.formatDateStr(r.日期 || r.date);
            return dateStr.startsWith(prefix);
          }).sort((a, b) => {
            const dateA = this.formatDateStr(a.日期 || a.date);
            const dateB = this.formatDateStr(b.日期 || b.date);
            if (dateA !== dateB) {
              return dateB.localeCompare(dateA);
            }
            return (b.ID || b.id || 0) - (a.ID || a.id || 0);
          });
        },

        get filteredPeriodRecords() {
          if (!this.searchQuery) return this.periodRecords;
          const q = this.searchQuery.toLowerCase();
          return this.periodRecords.filter(r => 
            (r.類別 || r.category || '').toLowerCase().includes(q) ||
            (r.備註 || r.note || '').toLowerCase().includes(q)
          );
        },

        get periodIncome() {
          return this.periodRecords
            .filter(r => !this.isExpense(r))
            .reduce((sum, r) => sum + this.getConvertedAmount(r), 0);
        },

        get periodExpense() {
          return this.periodRecords
            .filter(r => this.isExpense(r))
            .reduce((sum, r) => sum + this.getConvertedAmount(r), 0);
        },

        get periodNet() {
          return this.periodIncome - this.periodExpense;
        },

        get cumulativeTotal() {
          let prefix = this.currentFilterPrefix;
          
          return this.records
            .filter(r => {
              const dateStr = this.formatDateStr(r.日期 || r.date);
              if (!dateStr) return false;
              return dateStr <= (this.timeDimension === 'month' ? `${prefix}-31` : `${prefix}-12-31`);
            })
            .reduce((sum, r) => {
              const converted = this.getConvertedAmount(r);
              return sum + (this.isExpense(r) ? -converted : converted);
            }, 0);
        },

        get monthlySummaryList() {
          if (this.timeDimension !== 'year') return [];

          const monthMap = {};
          this.monthOptions.forEach(m => {
            monthMap[m] = { income: 0, expense: 0, total: 0 };
          });

          this.periodRecords.forEach(r => {
            const cat = r.類別 || r.category || '';
            
            if (this.monthlyFilterCategory !== 'all' && cat !== this.monthlyFilterCategory) {
              return;
            }

            const dateStr = this.formatDateStr(r.日期 || r.date);
            if (dateStr && dateStr.length >= 7) {
              const m = dateStr.substring(5, 7);
              if (monthMap[m]) {
                const converted = this.getConvertedAmount(r);
                
                if (this.isExpense(r)) {
                  monthMap[m].expense += converted;
                  monthMap[m].total -= converted;
                } else {
                  monthMap[m].income += converted;
                  monthMap[m].total += converted;
                }
              }
            }
          });

          return this.monthOptions.map(m => {
            const inc = monthMap[m].income;
            const exp = monthMap[m].expense;
            return {
              month: m,
              income: inc,
              expense: exp,
              net: inc - exp,
              total: monthMap[m].total
            };
          });
        },

        get incomeCategorySummaryList() {
          const totalSum = this.periodIncome;
          const map = {};

          this.periodRecords.forEach(r => {
            if (!this.isExpense(r)) {
              const cat = r.類別 || r.category || '未分類';
              const converted = this.getConvertedAmount(r);
              map[cat] = (map[cat] || 0) + converted;
            }
          });

          return Object.keys(map)
            .map(cat => {
              const amt = map[cat];
              const pct = totalSum > 0 ? ((amt / totalSum) * 100).toFixed(1) : 0;
              return { category: cat, amount: amt, percent: pct };
            })
            .sort((a, b) => b.amount - a.amount);
        },

        get expenseCategorySummaryList() {
          const totalSum = this.periodExpense;
          const map = {};

          this.periodRecords.forEach(r => {
            if (this.isExpense(r)) {
              const cat = r.類別 || r.category || '未分類';
              const converted = this.getConvertedAmount(r);
              map[cat] = (map[cat] || 0) + converted;
            }
          });

          return Object.keys(map)
            .map(cat => {
              const amt = map[cat];
              const pct = totalSum > 0 ? ((amt / totalSum) * 100).toFixed(1) : 0;
              return { category: cat, amount: amt, percent: pct };
            })
            .sort((a, b) => b.amount - a.amount);
        },

        openAddModal() {
          this.isAddingNew = true;
          const currentY = new Date().getFullYear().toString();
          const currentM = String(new Date().getMonth() + 1).padStart(2, '0');
          const currentD = String(new Date().getDate()).padStart(2, '0');

          this.editForm = {
            id: '',
            type: 'expense',
            date: `${currentY}-${currentM}-${currentD}`,
            category: this.expenseCategories[0],
            amount: '',
            currency: 'TWD',
            exchangeRate: 1,
            note: ''
          };
          this.showEditModal = true;
        },

        openEditModal(item) {
          this.isAddingNew = false;
          const dateStr = this.formatDateStr(item.日期 || item.date);

          this.editForm = {
            id: item.ID || item.id,
            type: this.isExpense(item) ? 'expense' : 'income',
            date: dateStr,
            category: item.類別 || item.category,
            amount: Math.abs(Number(item.金額 || item.amount || 0)),
            currency: item.幣別 || item.currency || 'TWD',
            exchangeRate: item.匯率 !== undefined && item.匯率 !== '' ? Number(item.匯率) : (item.exchangeRate !== undefined && item.exchangeRate !== '' ? Number(item.exchangeRate) : 1),
            note: item.備註 || item.note || ''
          };
          this.showEditModal = true;
        },

        async handleModalSubmit() {
          if (this.isAddingNew) {
            await this.addRecord();
          } else {
            await this.updateRecord();
          }
        },

        async addRecord() {
          if (this.loading) return;
          if (!this.editForm.amount || this.editForm.amount <= 0) return;
          
          this.loadingText = '新增儲存中...';
          this.loading = true;

          const addedYear = this.editForm.date.substring(0, 4);
          const addedMonth = this.editForm.date.substring(5, 7);
          const newId = Date.now().toString();

          const finalCurrency = this.editForm.currency || 'TWD';
          const finalRate = finalCurrency === 'TWD' ? 1 : (Number(this.editForm.exchangeRate) || 1);

          const localRecord = {
            ID: newId,
            id: newId,
            類型: this.editForm.type,
            type: this.editForm.type,
            日期: this.editForm.date,
            date: this.editForm.date,
            類別: this.editForm.category,
            category: this.editForm.category,
            金額: Number(this.editForm.amount),
            amount: Number(this.editForm.amount),
            幣別: finalCurrency,
            currency: finalCurrency,
            匯率: finalRate,
            exchangeRate: finalRate,
            備註: this.editForm.note,
            note: this.editForm.note
          };

          this.records.unshift(localRecord);
          this.selectedYear = addedYear;
          this.selectedMonth = addedMonth;

          const newItem = {
            action: 'add',
            type: this.editForm.type,
            date: this.editForm.date,
            category: this.editForm.category,
            amount: Number(this.editForm.amount),
            currency: finalCurrency,
            exchangeRate: finalRate,
            note: this.editForm.note
          };

          try {
            await fetch(this.webAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newItem)
            });
            this.showToast('紀錄新增成功！', 'success');
          } catch (e) {
            console.error('寫入 API 失敗', e);
            this.showToast('寫入失敗，請稍後再試', 'danger');
          } finally {
            this.loading = false;
            this.showEditModal = false;
          }
        },

        async updateRecord() {
          if (this.loading) return;
          this.loadingText = '紀錄更新中...';
          this.loading = true;

          const finalCurrency = this.editForm.currency || 'TWD';
          const finalRate = finalCurrency === 'TWD' ? 1 : (Number(this.editForm.exchangeRate) || 1);

          const idx = this.records.findIndex(r => (r.ID || r.id) === this.editForm.id);
          if (idx !== -1) {
            const calcAmount = Number(this.editForm.amount);

            this.records[idx].日期 = this.editForm.date;
            this.records[idx].date = this.editForm.date;
            this.records[idx].類型 = this.editForm.type;
            this.records[idx].type = this.editForm.type;
            this.records[idx].類別 = this.editForm.category;
            this.records[idx].category = this.editForm.category;
            this.records[idx].金額 = calcAmount;
            this.records[idx].amount = calcAmount;
            this.records[idx].幣別 = finalCurrency;
            this.records[idx].currency = finalCurrency;
            this.records[idx].匯率 = finalRate;
            this.records[idx].exchangeRate = finalRate;
            this.records[idx].備註 = this.editForm.note;
            this.records[idx].note = this.editForm.note;
          }

          try {
            await fetch(this.webAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                action: 'update', 
                id: this.editForm.id,
                type: this.editForm.type,
                date: this.editForm.date,
                category: this.editForm.category,
                amount: Number(this.editForm.amount),
                currency: finalCurrency,
                exchangeRate: finalRate,
                note: this.editForm.note
              })
            });
            this.showToast('紀錄已成功更新！', 'info');
          } catch (e) {
            console.error('更新失敗', e);
            this.showToast('更新失敗，請稍後再試', 'danger');
          } finally {
            this.loading = false;
            this.showEditModal = false;
          }
        },

        promptDeleteRecord() {
          if (this.isAddingNew) return;
          this.showConfirmModal = true;
        },

        async confirmDeleteRecord() {
          this.showConfirmModal = false;
          const targetId = this.editForm.id;
          const targetDate = this.editForm.date;

          this.loadingText = '紀錄刪除中...';
          this.loading = true;

          this.records = this.records.filter(r => (r.ID || r.id) !== targetId);

          try {
            await fetch(this.webAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'delete', id: targetId, date: targetDate })
            });
            this.showToast('已成功刪除該筆紀錄！', 'danger');
          } catch (e) {
            console.error('刪除失敗', e);
            this.showToast('刪除失敗，請稍後再試', 'danger');
          } finally {
            this.loading = false;
            this.showEditModal = false;
          }
        },

        openCalculator() {
          this.calcDisplay = this.editForm.amount !== '' && this.editForm.amount !== undefined ? String(this.editForm.amount) : '0';
          this.calcExpression = '';
          this.calcResetNext = true; 
          this.calcHasCalculated = true;
          this.showCalcModal = true;
        },

        calcClear() {
          this.calcDisplay = '0';
          this.calcExpression = '';
          this.calcResetNext = false;
          this.calcHasCalculated = false;
        },

        calcBackSpace() {
          if (this.calcResetNext) return;
          if (this.calcDisplay.length > 1) {
            this.calcDisplay = this.calcDisplay.slice(0, -1);
          } else {
            this.calcDisplay = '0';
          }
        },

        calcAppendNumber(num) {
          if (this.calcResetNext) {
            this.calcDisplay = num;
            this.calcResetNext = false;
          } else if (this.calcDisplay === '0') {
            this.calcDisplay = num;
          } else {
            if (num === '.' && this.calcDisplay.includes('.')) return;
            this.calcDisplay += num;
          }
          if (this.calcExpression !== '') {
            this.calcHasCalculated = false;
          }
        },

        calcAppendOperator(op) {
          if (this.calcExpression !== '' && !this.calcResetNext) {
            this.calcCalculate();
          }
          this.calcExpression = this.calcDisplay + ' ' + op;
          this.calcResetNext = true; 
          this.calcHasCalculated = false;
        },

        calcCalculate() {
          if (!this.calcExpression) return;
          try {
            const fullExpr = this.calcExpression + ' ' + this.calcDisplay;
            const sanitized = fullExpr.replace(/×/g, '*').replace(/÷/g, '/');
            const result = Function('"use strict";return (' + sanitized + ')')();
            
            if (!isFinite(result)) {
              this.showToast('運算錯誤', 'danger');
              this.calcClear();
              return;
            }

            this.calcDisplay = String(parseFloat(Number(result).toFixed(6)));
            this.calcExpression = fullExpr + ' =';
            this.calcResetNext = true;
            this.calcHasCalculated = true;
          } catch (e) {
            this.showToast('格式錯誤', 'danger');
            this.calcClear();
          }
        },

        calcConfirm() {
          if (!this.calcHasCalculated && this.calcExpression !== '') return;
          const val = parseFloat(this.calcDisplay);
          if (!isNaN(val) && val > 0) {
            this.editForm.amount = parseFloat(val.toFixed(6));
          }
          this.showCalcModal = false;
        }

      }
    }
  </script>
