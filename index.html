<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能記帳與財務分析系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12" x-data="appData()" x-init="initApp()">

  <!-- 頂部導覽列 -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-wallet text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">個人記帳與跨年分析</h1>
      </div>
      
      <!-- 年份切換器 -->
      <div class="flex items-center space-x-2 bg-indigo-700 px-3 py-1.5 rounded-lg">
        <span class="text-sm font-medium">檢視年份：</span>
        <select x-model="selectedYear" @change="loadDataForYear(selectedYear)" class="bg-indigo-800 text-white font-bold px-2 py-1 rounded outline-none cursor-pointer">
          <template x-for="year in availableYears" :key="year">
            <option :value="year" x-text="year + ' 年'"></option>
          </template>
        </select>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-6xl mx-auto px-4 mt-6 space-y-6">

    <!-- 頁籤切換 -->
    <div class="flex border-b border-slate-200 bg-white rounded-t-xl px-4 pt-2">
      <button @click="activeTab = 'tracker'" :class="activeTab === 'tracker' ? 'border-b-2 border-indigo-600 text-indigo-600 font-bold' : 'text-slate-500 hover:text-slate-700'" class="px-5 py-3 transition">
        <i class="fa-solid fa-pen-to-square me-2"></i>新增與明細
      </button>
      <button @click="activeTab = 'pie'" :class="activeTab === 'pie' ? 'border-b-2 border-indigo-600 text-indigo-600 font-bold' : 'text-slate-500 hover:text-slate-700'" class="px-5 py-3 transition">
        <i class="fa-solid fa-chart-pie me-2"></i>單月大項比例 (圓餅圖)
      </button>
      <button @click="activeTab = 'trend'" :class="activeTab === 'trend' ? 'border-b-2 border-indigo-600 text-indigo-600 font-bold' : 'text-slate-500 hover:text-slate-700'" class="px-5 py-3 transition">
        <i class="fa-solid fa-chart-line me-2"></i>大項月度走勢 (長條/波浪圖)
      </button>
    </div>

    <!-- Tab 1: 新增與明細列表 -->
    <div x-show="activeTab === 'tracker'" class="space-y-6">
      <!-- 記帳表單 -->
      <div class="bg-white p-6 rounded-b-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-4 text-slate-700">新增記帳項目</h2>
        <form @submit.prevent="addRecord" class="grid grid-cols-1 md:grid-cols-5 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>
            <input type="date" x-model="form.date" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">類別</label>
            <select x-model="form.category" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
              <template x-for="cat in categories" :key="cat">
                <option :value="cat" x-text="cat"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">金額</label>
            <input type="number" x-model.number="form.amount" required min="1" placeholder="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">備註</label>
            <input type="text" x-model="form.note" placeholder="例如：午餐、搭計程車" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div class="flex items-end">
            <button type="submit" :disabled="loading" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg hover:bg-indigo-700 transition flex justify-center items-center gap-2">
              <i class="fa-solid fa-plus" x-show="!loading"></i>
              <span x-text="loading ? '儲存中...' : '新增紀錄'"></span>
            </button>
          </div>
        </form>
      </div>

      <!-- 記帳明細列表 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-700" x-text="selectedYear + ' 年支出明細列表'"></h2>
          <span class="text-sm font-semibold text-slate-500">總計：<span class="text-indigo-600 font-bold" x-text="'$' + totalExpense"></span></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-100 text-slate-600 text-sm">
                <th class="p-3 rounded-l-lg">日期</th>
                <th class="p-3">類別</th>
                <th class="p-3">金額</th>
                <th class="p-3 rounded-r-lg">備註</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="item in currentRecords" :key="item.ID || item.date + item.amount">
                <tr class="border-b border-slate-100 hover:bg-slate-50">
                  <td class="p-3 text-slate-600" x-text="item.日期 || item.date"></td>
                  <td class="p-3"><span class="px-2.5 py-1 bg-indigo-50 text-indigo-600 font-semibold rounded-full text-xs" x-text="item.類別 || item.category"></span></td>
                  <td class="p-3 font-bold text-slate-700" x-text="'$' + (item.金額 || item.amount)"></td>
                  <td class="p-3 text-slate-500 text-sm" x-text="item.備註 || item.note"></td>
                </tr>
              </template>
              <template x-if="currentRecords.length === 0">
                <tr>
                  <td colspan="4" class="text-center py-6 text-slate-400">目前尚無此年份的記帳資料</td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Tab 2: 單月大項統計 (圓餅圖) -->
    <div x-show="activeTab === 'pie'" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4" x-init="$watch('activeTab', value => { if(value === 'pie') renderPieChart(); })">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-700">月份類別支出比例</h2>
        <select x-model="selectedMonth" @change="renderPieChart()" class="border border-slate-300 px-3 py-1.5 rounded-lg text-sm font-bold text-indigo-600 outline-none">
          <template x-for="m in 12" :key="m">
            <option :value="m" x-text="m + ' 月'"></option>
          </template>
        </select>
      </div>
      <div class="max-w-md mx-auto py-4">
        <canvas id="pieChart"></canvas>
      </div>
    </div>

    <!-- Tab 3: 每月大項起伏 (長條圖 / 波浪圖) -->
    <div x-show="activeTab === 'trend'" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4" x-init="$watch('activeTab', value => { if(value === 'trend') renderTrendChart(); })">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <h2 class="text-lg font-bold text-slate-700" x-text="selectedYear + ' 年大項月度走勢'"></h2>
        <div class="flex items-center space-x-3">
          <!-- 選擇圖表類型 -->
          <div class="bg-slate-100 p-1 rounded-lg flex text-xs font-bold">
            <button @click="chartType = 'bar'; renderTrendChart()" :class="chartType === 'bar' ? 'bg-white text-indigo-600 shadow' : 'text-slate-500'" class="px-3 py-1.5 rounded-md transition">長條圖</button>
            <button @click="chartType = 'line'; renderTrendChart()" :class="chartType === 'line' ? 'bg-white text-indigo-600 shadow' : 'text-slate-500'" class="px-3 py-1.5 rounded-md transition">波浪圖</button>
          </div>
        </div>
      </div>
      <div class="w-full py-4 min-h-[350px]">
        <canvas id="trendChart"></canvas>
      </div>
    </div>

  </main>

  <script>
    function appData() {
      return {
        activeTab: 'tracker',
        // 直接寫死你的 Web App URL
        webAppUrl: 'https://script.google.com/macros/s/AKfycbxD8BhK3xqXf4T0vqPTSkGlAxxZbj0dxfH9tmXgFbFYFOCfBnd3FzNlzBrRsBS7Y8TXHg/exec',
        selectedYear: new Date().getFullYear().toString(),
        selectedMonth: new Date().getMonth() + 1,
        availableYears: [new Date().getFullYear().toString()],
        categories: ['飲食', '交通', '娛樂', '購物', '居住', '醫療', '其他'],
        form: {
          date: new Date().toISOString().split('T')[0],
          category: '飲食',
          amount: '',
          note: ''
        },
        records: [],
        loading: false,
        pieChartInstance: null,
        trendChartInstance: null,
        chartType: 'bar',

        initApp() {
          this.fetchAvailableYears();
          this.loadDataForYear(this.selectedYear);
        },

        get currentRecords() {
          return this.records;
        },

        get totalExpense() {
          return this.records.reduce((sum, item) => sum + Number(item.金額 || item.amount || 0), 0);
        },

        // 從 API 取得目前發布的年份分頁
        async fetchAvailableYears() {
          try {
            const res = await fetch(`${this.webAppUrl}?action=getYears`);
            const data = await res.json();
            if (data.years && data.years.length > 0) {
              this.availableYears = data.years;
            }
          } catch (e) {
            console.warn('無法讀取年份，使用預設年份', e);
          }
        },

        // 載入特定年份的資料
        async loadDataForYear(year) {
          this.selectedYear = year;
          try {
            const res = await fetch(`${this.webAppUrl}?action=getData&year=${year}`);
            const data = await res.json();
            this.records = data.data || [];
          } catch (e) {
            console.error('載入失敗，改讀本機備份', e);
            this.loadLocalData(year);
          }
          
          if (this.activeTab === 'pie') this.renderPieChart();
          if (this.activeTab === 'trend') this.renderTrendChart();
        },

        loadLocalData(year) {
          const local = localStorage.getItem(`ACCOUNTING_DATA_${year}`);
          this.records = local ? JSON.parse(local) : [];
        },

        // 新增紀錄
        async addRecord() {
          if (!this.form.amount || this.form.amount <= 0) return;
          this.loading = true;

          const recordYear = new Date(this.form.date).getFullYear().toString();
          const newItem = {
            date: this.form.date,
            category: this.form.category,
            amount: Number(this.form.amount),
            note: this.form.note
          };

          try {
            await fetch(this.webAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newItem)
            });
          } catch (e) {
            console.error('寫入 API 失敗', e);
          }

          // 本地備份
          const yearRecords = recordYear === this.selectedYear ? this.records : [];
          const updated = [newItem, ...yearRecords];
          localStorage.setItem(`ACCOUNTING_DATA_${recordYear}`, JSON.stringify(updated));

          if (recordYear === this.selectedYear) {
            this.records = updated;
          }

          this.form.amount = '';
          this.form.note = '';
          this.loading = false;
          alert('新增記帳成功！');

          if (!this.availableYears.includes(recordYear)) {
            this.availableYears.push(recordYear);
          }

          if (this.activeTab === 'pie') this.renderPieChart();
          if (this.activeTab === 'trend') this.renderTrendChart();
        },

        // 繪製圓餅圖
        renderPieChart() {
          const monthFiltered = this.records.filter(r => {
            const d = new Date(r.日期 || r.date);
            return (d.getMonth() + 1) === Number(this.selectedMonth);
          });

          const catSums = {};
          this.categories.forEach(c => catSums[c] = 0);
          monthFiltered.forEach(r => {
            const cat = r.類別 || r.category;
            if (catSums[cat] !== undefined) {
              catSums[cat] += Number(r.金額 || r.amount || 0);
            }
          });

          const ctx = document.getElementById('pieChart').getContext('2d');
          if (this.pieChartInstance) this.pieChartInstance.destroy();

          this.pieChartInstance = new Chart(ctx, {
            type: 'pie',
            data: {
              labels: Object.keys(catSums),
              datasets: [{
                data: Object.values(catSums),
                backgroundColor: [
                  '#f87171', '#3b82f6', '#fbbf24', '#34d399', '#a78bfa', '#f472b6', '#9ca3af'
                ]
              }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
          });
        },

        // 繪製走勢圖 (長條/波浪)
        renderTrendChart() {
          const monthLabels = Array.from({ length: 12 }, (_, i) => (i + 1) + '月');
          const colors = ['#f87171', '#3b82f6', '#fbbf24', '#34d399', '#a78bfa', '#f472b6', '#9ca3af'];

          const datasets = this.categories.map((cat, idx) => {
            const monthlyData = Array(12).fill(0);
            this.records.forEach(r => {
              if ((r.類別 || r.category) === cat) {
                const m = new Date(r.日期 || r.date).getMonth();
                monthlyData[m] += Number(r.金額 || r.amount || 0);
              }
            });

            return {
              label: cat,
              data: monthlyData,
              backgroundColor: colors[idx % colors.length],
              borderColor: colors[idx % colors.length],
              tension: 0.4,
              fill: false
            };
          });

          const ctx = document.getElementById('trendChart').getContext('2d');
          if (this.trendChartInstance) this.trendChartInstance.destroy();

          this.trendChartInstance = new Chart(ctx, {
            type: this.chartType,
            data: {
              labels: monthLabels,
              datasets: datasets
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: { y: { beginAtZero: true } },
              plugins: { legend: { position: 'bottom' } }
            }
          });
        }
      }
    }
  </script>
</body>
</html>
