<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>記帳與財務分析系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [x-cloak] { display: none !important; }
    
    *, ::before, ::after {
      box-sizing: border-box !important;
    }

    input, select, button {
      font-size: 16px !important;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    .custom-select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2064748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.75rem center;
      background-size: 1em;
      padding-right: 2.2rem !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12 overflow-x-hidden" x-data="appData()" x-init="initApp()">

  <!-- 頂部導覽列 -->
  <header class="bg-emerald-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-wallet text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">個人記帳與財務分析</h1>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-6xl mx-auto px-4 mt-6 space-y-6 w-full box-border">

    <!-- 記帳與紀錄 -->
    <div class="space-y-6 w-full">
      
      <!-- 記帳表單 -->
      <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200 w-full box-border overflow-hidden">
        <h2 class="text-lg font-bold mb-4 text-slate-700">新增交易紀錄</h2>
        <form @submit.prevent="addRecord" class="space-y-4 w-full">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">收支類型</label>
            <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl w-full">
              <button type="button" @click="setFormType('expense')" :class="form.type === 'expense' ? 'bg-rose-500 text-white font-bold shadow' : 'text-slate-600'" class="py-2 rounded-lg text-sm transition flex justify-center items-center gap-2">
                <i class="fa-solid fa-arrow-down"></i> 支出 (負數)
              </button>
              <button type="button" @click="setFormType('income')" :class="form.type === 'income' ? 'bg-emerald-500 text-white font-bold shadow' : 'text-slate-600'" class="py-2 rounded-lg text-sm transition flex justify-center items-center gap-2">
                <i class="fa-solid fa-arrow-up"></i> 收入 (正數)
              </button>
            </div>
          </div>

          <div class="space-y-4 w-full">
            
            <!-- 日期選擇 -->
            <div class="w-full">
              <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>
              <div class="grid grid-cols-2 md:grid-cols-3 gap-2 w-full">
                <div class="col-span-2 md:col-span-1">
                  <select x-model="formYear" @change="updateFormDateFromDropdown()" class="custom-select w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white text-sm font-medium text-slate-700">
                    <template x-for="y in yearOptions" :key="y">
                      <option :value="y" x-text="y + '年'"></option>
                    </template>
                  </select>
                </div>
                <div class="col-span-1">
                  <select x-model="formMonth" @change="updateFormDateFromDropdown()" class="custom-select w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white text-sm font-medium text-slate-700">
                    <template x-for="m in monthOptions" :key="m">
                      <option :value="m" x-text="parseInt(m, 10) + '月'"></option>
                    </template>
                  </select>
                </div>
                <div class="col-span-1">
                  <select x-model="formDay" @change="updateFormDateFromDropdown()" class="custom-select w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white text-sm font-medium text-slate-700">
                    <template x-for="d in formDaysList" :key="d">
                      <option :value="d" x-text="parseInt(d, 10) + '日'"></option>
                    </template>
                  </select>
                </div>
              </div>
            </div>

            <!-- 分類 與 金額 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
              <div class="w-full">
                <label class="block text-xs font-semibold text-slate-500 mb-1">分類</label>
                <select x-model="form.category" class="custom-select w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white text-sm font-medium text-slate-700">
                  <template x-for="cat in currentCategories" :key="cat">
                    <option :value="cat" x-text="cat"></option>
                  </template>
                </select>
              </div>

              <div class="w-full">
                <label class="block text-xs font-semibold text-slate-500 mb-1">金額 ($)</label>
                <input type="number" x-model.number="form.amount" required min="1" placeholder="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white text-sm">
              </div>
            </div>

            <!-- 備註 -->
            <div class="w-full">
              <label class="block text-xs font-semibold text-slate-500 mb-1">備註</label>
              <input type="text" x-model="form.note" placeholder="例如：薪水、午餐" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white text-sm">
            </div>

          </div>

          <button type="submit" :disabled="loading" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg hover:bg-emerald-700 transition flex justify-center items-center gap-2 mt-4">
            <i class="fa-solid fa-plus" x-show="!loading"></i>
            <span x-text="loading ? '儲存中...' : '儲存紀錄'"></span>
          </button>
        </form>
      </div>

      <!-- 紀錄展示區 -->
      <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200 w-full box-border overflow-hidden">
        
        <!-- 上方工具列 -->
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-6 pb-4 border-b border-slate-100 w-full">
          
          <div class="flex flex-col md:flex-row items-stretch md:items-center gap-3 w-full lg:w-auto shrink-0">
            <!-- 1. 切換按鈕 (交易紀錄清單 / 類別統計加總) -->
            <div class="bg-slate-100 p-1 rounded-xl flex items-center space-x-1 w-full md:w-auto shrink-0">
              <button @click="trackerSubView = 'list'" :class="trackerSubView === 'list' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 md:flex-none px-3.5 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-list"></i> 交易紀錄清單
              </button>
              <button @click="trackerSubView = 'summary'" :class="trackerSubView === 'summary' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 md:flex-none px-3.5 py-1.5 rounded-lg text-sm transition flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-chart-bar"></i> 類別統計加總
              </button>
            </div>

            <!-- 時間選擇控制區 (包含 月/年 切換與下拉選單) -->
            <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2 w-full md:w-auto shrink-0">
              <!-- 2. 月 / 年 切換按鈕 (小版型在上；大螢幕在左側) -->
              <div class="bg-slate-100 p-1 rounded-xl flex items-center space-x-1 w-full md:w-auto shrink-0">
                <button @click="switchTimeDimension('month')" :class="timeDimension === 'month' ? 'bg-emerald-600 text-white font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 md:flex-none px-3 py-1.5 text-center rounded-lg text-xs transition whitespace-nowrap">
                  月
                </button>
                <button @click="switchTimeDimension('year')" :class="timeDimension === 'year' ? 'bg-emerald-600 text-white font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="flex-1 md:flex-none px-3 py-1.5 text-center rounded-lg text-xs transition whitespace-nowrap">
                  年
                </button>
              </div>

              <!-- 3. 月份/年份 下拉選單 (小版型在下；大螢幕在右側) -->
              <div class="flex items-center space-x-1 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 w-full md:w-auto justify-between md:justify-start shrink-0">
                <span class="text-xs font-semibold text-slate-500 whitespace-nowrap shrink-0" x-text="timeDimension === 'month' ? '月份：' : '年份：'"></span>
                <select x-model="selectedTimePeriod" @change="onPeriodDropdownChange" class="custom-select bg-transparent font-bold text-emerald-700 text-sm outline-none cursor-pointer pr-6 whitespace-nowrap">
                  <template x-for="timeItem in availableTimeOptions" :key="timeItem">
                    <option :value="timeItem" x-text="formatPeriodLabel(timeItem)"></option>
                  </template>
                </select>
              </div>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-4 w-full lg:w-auto justify-between lg:justify-end">
            <!-- 搜尋框 (僅在清單視圖顯示) -->
            <input x-show="trackerSubView === 'list'" type="text" x-model="searchQuery" placeholder="搜尋備註/類別..." class="w-full sm:w-auto px-3 py-1.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">

            <!-- 小計 -->
            <div class="text-sm font-semibold flex justify-between sm:justify-start w-full sm:w-auto gap-3 pt-2 sm:pt-0 whitespace-nowrap">
              <span class="text-emerald-600"><span x-text="formatPeriodLabel(selectedTimePeriod) + '收入:'"></span> <span class="font-bold" x-text="'+$' + periodIncome.toLocaleString()"></span></span>
              <span class="text-rose-500"><span x-text="formatPeriodLabel(selectedTimePeriod) + '支出:'"></span> <span class="font-bold" x-text="'-$' + periodExpense.toLocaleString()"></span></span>
            </div>
          </div>
        </div>

        <!-- 視圖 1：交易紀錄清單 -->
        <div x-show="trackerSubView === 'list'" class="divide-y divide-slate-100 w-full">
          <template x-for="item in filteredPeriodRecords" :key="item.ID || item.id">
            <div class="py-3 flex justify-between items-center hover:bg-slate-50 px-1 sm:px-2 rounded-lg transition gap-2">
              <div class="flex items-center space-x-2 sm:space-x-3 min-w-0">
                
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full flex-shrink-0 flex items-center justify-center text-sm font-bold" :class="getCategoryStyle(item.類別 || item.category).bgClass">
                  <i :class="getCategoryStyle(item.類別 || item.category).icon"></i>
                </div>

                <div class="min-w-0">
                  <div class="flex items-center space-x-1.5 sm:space-x-2 flex-wrap">
                    <span class="font-bold text-slate-800 text-sm sm:text-base truncate" x-text="item.類別 || item.category"></span>
                    <span class="text-[10px] sm:text-xs px-1.5 py-0.5 rounded text-slate-500 bg-slate-100 flex-shrink-0" x-text="formatDateStr(item.日期 || item.date)"></span>
                  </div>
                  <p class="text-xs text-slate-400 truncate" x-text="item.備註 || item.note || '無備註'"></p>
                </div>
              </div>

              <div class="flex items-center space-x-2 sm:space-x-4 flex-shrink-0">
                <span class="font-bold text-sm sm:text-base" :class="isExpense(item) ? 'text-rose-500' : 'text-emerald-600'" x-text="formatAmount(item)"></span>
                <div class="flex space-x-1 text-slate-400">
                  <button @click="openEditModal(item)" class="p-1 sm:p-1.5 hover:text-indigo-600 rounded transition"><i class="fa-solid fa-pen"></i></button>
                  <button @click="deleteRecord(item)" class="p-1 sm:p-1.5 hover:text-rose-600 rounded transition"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>
            </div>
          </template>
          
          <template x-if="filteredPeriodRecords.length === 0">
            <div class="text-center py-8 text-slate-400" x-text="formatPeriodLabel(selectedTimePeriod) + ' 無符合條件的交易紀錄'"></div>
          </template>
        </div>

        <!-- 視圖 2：類別加總統計（上方收入，下方支出，全部呈現） -->
        <div x-show="trackerSubView === 'summary'" class="space-y-8 py-2 w-full">
          
          <!-- 上方：收入統計 -->
          <div class="space-y-4 bg-emerald-50/40 p-4 rounded-xl border border-emerald-100">
            <h3 class="text-base font-bold text-emerald-700 flex items-center gap-2">
              <i class="fa-solid fa-arrow-up text-emerald-600"></i> 收入統計加總
            </h3>

            <template x-for="cat in incomeCategorySummaryList" :key="cat.category">
              <div class="space-y-1 w-full">
                <div class="flex justify-between items-center text-sm">
                  <div class="flex items-center space-x-2">
                    <i :class="getCategoryStyle(cat.category).icon + ' ' + getCategoryStyle(cat.category).textClass"></i>
                    <span class="font-bold text-slate-700" x-text="cat.category"></span>
                  </div>
                  <div class="space-x-2">
                    <span class="text-xs text-slate-400" x-text="cat.percent + '%'"></span>
                    <span class="font-bold text-emerald-600" x-text="'+$' + cat.amount.toLocaleString()"></span>
                  </div>
                </div>
                <div class="w-full bg-emerald-100/60 rounded-full h-3 overflow-hidden">
                  <div class="h-3 rounded-full bg-emerald-500 transition-all duration-300" 
                       :style="'width: ' + cat.percent + '%'"></div>
                </div>
              </div>
            </template>

            <template x-if="incomeCategorySummaryList.length === 0">
              <div class="text-center py-4 text-slate-400 text-sm" x-text="formatPeriodLabel(selectedTimePeriod) + ' 尚無收入紀錄'"></div>
            </template>
          </div>

          <!-- 下方：支出統計 -->
          <div class="space-y-4 bg-rose-50/40 p-4 rounded-xl border border-rose-100">
            <h3 class="text-base font-bold text-rose-700 flex items-center gap-2">
              <i class="fa-solid fa-arrow-down text-rose-600"></i> 支出統計加總
            </h3>

            <template x-for="cat in expenseCategorySummaryList" :key="cat.category">
              <div class="space-y-1 w-full">
                <div class="flex justify-between items-center text-sm">
                  <div class="flex items-center space-x-2">
                    <i :class="getCategoryStyle(cat.category).icon + ' ' + getCategoryStyle(cat.category).textClass"></i>
                    <span class="font-bold text-slate-700" x-text="cat.category"></span>
                  </div>
                  <div class="space-x-2">
                    <span class="text-xs text-slate-400" x-text="cat.percent + '%'"></span>
                    <span class="font-bold text-rose-500" x-text="'-$' + cat.amount.toLocaleString()"></span>
                  </div>
                </div>
                <div class="w-full bg-rose-100/60 rounded-full h-3 overflow-hidden">
                  <div class="h-3 rounded-full bg-rose-500 transition-all duration-300" 
                       :style="'width: ' + cat.percent + '%'"></div>
                </div>
              </div>
            </template>

            <template x-if="expenseCategorySummaryList.length === 0">
              <div class="text-center py-4 text-slate-400 text-sm" x-text="formatPeriodLabel(selectedTimePeriod) + ' 尚無支出紀錄'"></div>
            </template>
          </div>

        </div>

      </div>
    </div>

  </main>

  <!-- 編輯 Modal 彈窗 -->
  <div x-show="showEditModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex justify-center items-center p-4 z-50" x-cloak>
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-5 sm:p-6 space-y-4 box-border">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-lg text-slate-700">編輯交易紀錄</h3>
        <button @click="showEditModal = false" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form @submit.prevent="updateRecord" class="space-y-3 w-full">
        
        <div class="w-full">
          <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-2 w-full">
            <div class="col-span-2 md:col-span-1">
              <select x-model="editYear" @change="updateEditDateFromDropdown()" class="custom-select w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white text-sm font-medium text-slate-700">
                <template x-for="y in yearOptions" :key="y">
                  <option :value="y" x-text="y + '年'"></option>
                </template>
              </select>
            </div>
            <div class="col-span-1">
              <select x-model="editMonth" @change="updateEditDateFromDropdown()" class="custom-select w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white text-sm font-medium text-slate-700">
                <template x-for="m in monthOptions" :key="m">
                  <option :value="m" x-text="parseInt(m, 10) + '月'"></option>
                </template>
              </select>
            </div>
            <div class="col-span-1">
              <select x-model="editDay" @change="updateEditDateFromDropdown()" class="custom-select w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white text-sm font-medium text-slate-700">
                <template x-for="d in editDaysList" :key="d">
                  <option :value="d" x-text="parseInt(d, 10) + '日'"></option>
                </template>
              </select>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">金額 ($)</label>
          <input type="number" x-model.number="editForm.amount" required min="1" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 bg-white text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">備註</label>
          <input type="text" x-model="editForm.note" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 bg-white text-sm">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" @click="showEditModal = false" class="w-1/2 py-2 border rounded-lg text-slate-600 font-semibold">取消</button>
          <button type="submit" :disabled="loading" class="w-1/2 py-2 bg-emerald-600 text-white rounded-lg font-semibold hover:bg-emerald-700">更新紀錄</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function appData() {
      const now = new Date();
      const currentYearStr = now.getFullYear().toString();
      const currentMonthStr = String(now.getMonth() + 1).padStart(2, '0');
      const currentDayStr = String(now.getDate()).padStart(2, '0');

      return {
        trackerSubView: 'list', // 'list' | 'summary'
        timeDimension: 'month',  // 'month' | 'year'
        selectedTimePeriod: `${currentYearStr}-${currentMonthStr}`,
        
        webAppUrl: 'https://script.google.com/macros/s/AKfycbwxyqVeM-LHKa1dIa2JF9H0xF7xCvhyUdpMdeiyk4JIri4y8qqKKFQ-cRuVmuYQ7w5rLQ/exec',
        selectedYear: currentYearStr,
        searchQuery: '',
        
        incomeCategories: ['薪水', '兼職', '獎金', '紅包', '中獎'],
        expenseCategories: ['飲食', '住家', '交通', '購物', '醫療', '旅遊', 'Pet麻糬', '電信費', '電費', '水費', '瓦斯費', '手續費', '娛樂'],
        
        categoryStyles: {
          '飲食': { icon: 'fa-solid fa-utensils', bgClass: 'bg-amber-100 text-amber-600', textClass: 'text-amber-500' },
          '住家': { icon: 'fa-solid fa-house', bgClass: 'bg-indigo-100 text-indigo-600', textClass: 'text-indigo-500' },
          '交通': { icon: 'fa-solid fa-car', bgClass: 'bg-blue-100 text-blue-600', textClass: 'text-blue-500' },
          '購物': { icon: 'fa-solid fa-bag-shopping', bgClass: 'bg-pink-100 text-pink-600', textClass: 'text-pink-500' },
          '醫療': { icon: 'fa-solid fa-notes-medical', bgClass: 'bg-red-100 text-red-600', textClass: 'text-red-500' },
          '旅遊': { icon: 'fa-solid fa-plane', bgClass: 'bg-sky-100 text-sky-600', textClass: 'text-sky-500' },
          'Pet麻糬': { icon: 'fa-solid fa-carrot', bgClass: 'bg-orange-100 text-orange-600', textClass: 'text-orange-500' },
          '電信費': { icon: 'fa-solid fa-mobile-screen-button', bgClass: 'bg-cyan-100 text-cyan-600', textClass: 'text-cyan-500' },
          '電費': { icon: 'fa-solid fa-bolt', bgClass: 'bg-yellow-100 text-yellow-600', textClass: 'text-yellow-500' },
          '水費': { icon: 'fa-solid fa-droplet', bgClass: 'bg-teal-100 text-teal-600', textClass: 'text-teal-500' },
          '瓦斯費': { icon: 'fa-solid fa-fire', bgClass: 'bg-rose-100 text-rose-600', textClass: 'text-rose-500' },
          '手續費': { icon: 'fa-solid fa-receipt', bgClass: 'bg-slate-200 text-slate-700', textClass: 'text-slate-600' },
          '娛樂': { icon: 'fa-solid fa-gamepad', bgClass: 'bg-purple-100 text-purple-600', textClass: 'text-purple-500' },
          '薪水': { icon: 'fa-solid fa-money-bill-wave', bgClass: 'bg-emerald-100 text-emerald-600', textClass: 'text-emerald-500' },
          '兼職': { icon: 'fa-solid fa-briefcase', bgClass: 'bg-green-100 text-green-600', textClass: 'text-green-500' },
          '獎金': { icon: 'fa-solid fa-trophy', bgClass: 'bg-yellow-100 text-yellow-600', textClass: 'text-yellow-500' },
          '紅包': { icon: 'fa-solid fa-envelope-open-text', bgClass: 'bg-red-100 text-red-600', textClass: 'text-red-500' },
          '中獎': { icon: 'fa-solid fa-gift', bgClass: 'bg-fuchsia-100 text-fuchsia-600', textClass: 'text-fuchsia-500' }
        },

        yearOptions: [],
        monthOptions: ['01','02','03','04','05','06','07','08','09','10','11','12'],
        formDaysList: [],
        editDaysList: [],

        formYear: currentYearStr,
        formMonth: currentMonthStr,
        formDay: currentDayStr,
        form: {
          type: 'expense',
          date: `${currentYearStr}-${currentMonthStr}-${currentDayStr}`,
          category: '飲食',
          amount: '',
          note: ''
        },

        editYear: currentYearStr,
        editMonth: currentMonthStr,
        editDay: currentDayStr,
        showEditModal: false,
        editForm: { id: '', type: 'expense', date: '', category: '', amount: '', note: '' },

        records: [],
        loading: false,

        initApp() {
          const cy = new Date().getFullYear();
          const years = [];
          for (let y = cy - 3; y <= cy + 3; y++) {
            years.push(String(y));
          }
          this.yearOptions = years;

          this.rebuildFormDays();
          this.rebuildEditDays();

          this.loadDataForYear(this.selectedYear);
        },

        switchTimeDimension(dim) {
          this.timeDimension = dim;
          if (this.availableTimeOptions.length > 0) {
            this.selectedTimePeriod = this.availableTimeOptions[0];
          }
        },

        onPeriodDropdownChange() {
          const targetYear = this.selectedTimePeriod.substring(0, 4);
          if (targetYear !== this.selectedYear) {
            this.loadDataForYear(targetYear);
          }
        },

        rebuildFormDays() {
          const y = parseInt(this.formYear, 10);
          const m = parseInt(this.formMonth, 10);
          const totalDays = new Date(y, m, 0).getDate();
          
          const days = [];
          for (let d = 1; d <= totalDays; d++) {
            days.push(String(d).padStart(2, '0'));
          }
          this.formDaysList = days;

          if (parseInt(this.formDay, 10) > totalDays) {
            this.formDay = String(totalDays).padStart(2, '0');
          }
        },

        rebuildEditDays() {
          const y = parseInt(this.editYear, 10);
          const m = parseInt(this.editMonth, 10);
          const totalDays = new Date(y, m, 0).getDate();

          const days = [];
          for (let d = 1; d <= totalDays; d++) {
            days.push(String(d).padStart(2, '0'));
          }
          this.editDaysList = days;

          if (parseInt(this.editDay, 10) > totalDays) {
            this.editDay = String(totalDays).padStart(2, '0');
          }
        },

        updateFormDateFromDropdown() {
          this.rebuildFormDays();
          this.form.date = `${this.formYear}-${this.formMonth}-${this.formDay}`;
        },

        updateEditDateFromDropdown() {
          this.rebuildEditDays();
          this.editForm.date = `${this.editYear}-${this.editMonth}-${this.editDay}`;
        },

        getCategoryStyle(category) {
          return this.categoryStyles[category] || {
            icon: 'fa-solid fa-tags',
            bgClass: 'bg-slate-100 text-slate-600',
            textClass: 'text-slate-500'
          };
        },

        formatDateStr(str) {
          if (!str) return '';
          let cleanStr = String(str);
          if (cleanStr.includes('T')) {
            cleanStr = cleanStr.split('T')[0];
          }
          return cleanStr.substring(0, 10);
        },

        formatPeriodLabel(periodStr) {
          if (!periodStr) return '';
          const parts = periodStr.split('-');
          if (parts.length === 1) return `${parts[0]}年`;
          if (parts.length === 2) return `${parts[0]}年${parseInt(parts[1], 10)}月`;
          return periodStr;
        },

        get currentCategories() {
          return this.form.type === 'expense' ? this.expenseCategories : this.incomeCategories;
        },

        setFormType(type) {
          this.form.type = type;
          this.form.category = type === 'expense' ? this.expenseCategories[0] : this.incomeCategories[0];
        },

        isExpense(item) {
          const type = item.類型 || item.type;
          const amt = Number(item.金額 || item.amount || 0);
          return type === 'expense' || amt < 0;
        },

        formatAmount(item) {
          const amt = Math.abs(Number(item.金額 || item.amount || 0));
          return (this.isExpense(item) ? '-$' : '+$') + amt.toLocaleString();
        },

        get availableTimeOptions() {
          const set = new Set();
          this.records.forEach(r => {
            const dateStr = this.formatDateStr(r.日期 || r.date);
            if (dateStr && dateStr.length >= 4) {
              if (this.timeDimension === 'year') {
                set.add(dateStr.substring(0, 4));
              } else {
                if (dateStr.length >= 7) {
                  set.add(dateStr.substring(0, 7));
                }
              }
            }
          });

          if (set.size === 0) {
            const now = new Date();
            const currentStr = this.timeDimension === 'year' 
              ? `${now.getFullYear()}` 
              : `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            set.add(currentStr);
          }

          return Array.from(set).sort((a, b) => b.localeCompare(a));
        },

        get periodRecords() {
          if (!this.selectedTimePeriod) return [];

          return this.records.filter(r => {
            const dateStr = this.formatDateStr(r.日期 || r.date);
            return dateStr.startsWith(this.selectedTimePeriod);
          }).sort((a, b) => {
            const dateA = this.formatDateStr(a.日期 || a.date);
            const dateB = this.formatDateStr(b.日期 || b.date);
            if (dateA !== dateB) {
              return dateB.localeCompare(dateA);
            }
            return (b.ID || b.id || 0) - (a.ID || a.id || 0);
          });
        },

        get filteredPeriodRecords() {
          if (!this.searchQuery) return this.periodRecords;
          const q = this.searchQuery.toLowerCase();
          return this.periodRecords.filter(r => 
            (r.類別 || r.category || '').toLowerCase().includes(q) ||
            (r.備註 || r.note || '').toLowerCase().includes(q)
          );
        },

        get periodIncome() {
          return this.periodRecords
            .filter(r => !this.isExpense(r))
            .reduce((sum, r) => sum + Math.abs(Number(r.金額 || r.amount || 0)), 0);
        },

        get periodExpense() {
          return this.periodRecords
            .filter(r => this.isExpense(r))
            .reduce((sum, r) => sum + Math.abs(Number(r.金額 || r.amount || 0)), 0);
        },

        get incomeCategorySummaryList() {
          const totalSum = this.periodIncome;
          const map = {};

          this.periodRecords.forEach(r => {
            if (!this.isExpense(r)) {
              const cat = r.類別 || r.category || '未分類';
              const amt = Math.abs(Number(r.金額 || r.amount || 0));
              map[cat] = (map[cat] || 0) + amt;
            }
          });

          return Object.keys(map)
            .map(cat => {
              const amt = map[cat];
              const pct = totalSum > 0 ? ((amt / totalSum) * 100).toFixed(1) : 0;
              return { category: cat, amount: amt, percent: pct };
            })
            .sort((a, b) => b.amount - a.amount);
        },

        get expenseCategorySummaryList() {
          const totalSum = this.periodExpense;
          const map = {};

          this.periodRecords.forEach(r => {
            if (this.isExpense(r)) {
              const cat = r.類別 || r.category || '未分類';
              const amt = Math.abs(Number(r.金額 || r.amount || 0));
              map[cat] = (map[cat] || 0) + amt;
            }
          });

          return Object.keys(map)
            .map(cat => {
              const amt = map[cat];
              const pct = totalSum > 0 ? ((amt / totalSum) * 100).toFixed(1) : 0;
              return { category: cat, amount: amt, percent: pct };
            })
            .sort((a, b) => b.amount - a.amount);
        },

        async loadDataForYear(year) {
          this.selectedYear = year;
          try {
            const res = await fetch(`${this.webAppUrl}?action=getData&year=${year}`);
            const data = await res.json();
            this.records = data.data || [];
          } catch (e) {
            console.error('載入失敗', e);
          }

          if (this.availableTimeOptions.length > 0) {
            if (!this.selectedTimePeriod || !this.availableTimeOptions.includes(this.selectedTimePeriod)) {
              this.selectedTimePeriod = this.availableTimeOptions[0];
            }
          }
        },

        async addRecord() {
          if (!this.form.amount || this.form.amount <= 0) return;
          this.loading = true;

          const addedDateYM = this.form.date.substring(0, 7);
          const newId = Date.now().toString();

          const localRecord = {
            ID: newId,
            id: newId,
            類型: this.form.type,
            type: this.form.type,
            日期: this.form.date,
            date: this.form.date,
            類別: this.form.category,
            category: this.form.category,
            金額: this.form.type === 'expense' ? -Math.abs(Number(this.form.amount)) : Math.abs(Number(this.form.amount)),
            amount: this.form.type === 'expense' ? -Math.abs(Number(this.form.amount)) : Math.abs(Number(this.form.amount)),
            備註: this.form.note,
            note: this.form.note
          };

          this.records.unshift(localRecord);
          if (this.timeDimension === 'month') {
            this.selectedTimePeriod = addedDateYM;
          } else {
            this.selectedTimePeriod = addedDateYM.substring(0, 4);
          }

          const newItem = {
            action: 'add',
            type: this.form.type,
            date: this.form.date,
            category: this.form.category,
            amount: Number(this.form.amount),
            note: this.form.note
          };

          try {
            fetch(this.webAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newItem)
            });
          } catch (e) {
            console.error('寫入 API 失敗', e);
          }

          this.form.amount = '';
          this.form.note = '';
          this.loading = false;
          alert('紀錄新增成功！');
        },

        openEditModal(item) {
          const dateStr = this.formatDateStr(item.日期 || item.date);
          const parts = dateStr.split('-');
          
          if (parts.length === 3) {
            this.editYear = parts[0];
            this.editMonth = parts[1];
            this.editDay = parts[2];
            this.rebuildEditDays();
          }

          this.editForm = {
            id: item.ID || item.id,
            type: this.isExpense(item) ? 'expense' : 'income',
            date: dateStr,
            category: item.類別 || item.category,
            amount: Math.abs(Number(item.金額 || item.amount || 0)),
            note: item.備註 || item.note || ''
          };
          this.showEditModal = true;
        },

        async updateRecord() {
          this.loading = true;

          const idx = this.records.findIndex(r => (r.ID || r.id) === this.editForm.id);
          if (idx !== -1) {
            this.records[idx].日期 = this.editForm.date;
            this.records[idx].date = this.editForm.date;
            this.records[idx].金額 = this.editForm.type === 'expense' ? -Math.abs(Number(this.editForm.amount)) : Math.abs(Number(this.editForm.amount));
            this.records[idx].amount = this.records[idx].金額;
            this.records[idx].備註 = this.editForm.note;
            this.records[idx].note = this.editForm.note;
          }

          try {
            fetch(this.webAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'update', ...this.editForm })
            });
          } catch (e) {
            console.error('更新失敗', e);
          }

          this.loading = false;
          this.showEditModal = false;
          alert('紀錄已成功更新！');
        },

        async deleteRecord(item) {
          if (!confirm('確定要刪除這筆交易紀錄嗎？')) return;
          this.loading = true;

          const targetId = item.ID || item.id;
          this.records = this.records.filter(r => (r.ID || r.id) !== targetId);

          try {
            fetch(this.webAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'delete', id: targetId, date: item.日期 || item.date })
            });
          } catch (e) {
            console.error('刪除失敗', e);
          }

          this.loading = false;
          alert('已成功刪除該筆紀錄！');
        }
      }
    }
  </script>
</body>
