<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tally - 智能記帳與財務分析系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12" x-data="appData()" x-init="initApp()">

  <!-- 頂部導覽列 -->
  <header class="bg-emerald-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-wallet text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">Tally 個人記帳與財務分析</h1>
      </div>
      
      <!-- 年份切換器 -->
      <div class="flex items-center space-x-2 bg-emerald-700 px-3 py-1.5 rounded-lg">
        <span class="text-sm font-medium">檢視年份：</span>
        <select x-model="selectedYear" @change="loadDataForYear(selectedYear)" class="bg-emerald-800 text-white font-bold px-2 py-1 rounded outline-none cursor-pointer">
          <template x-for="year in availableYears" :key="year">
            <option :value="year" x-text="year + ' 年'"></option>
          </template>
        </select>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-6xl mx-auto px-4 mt-6 space-y-6">

    <!-- 頁籤切換 -->
    <div class="flex border-b border-slate-200 bg-white rounded-t-xl px-4 pt-2">
      <button @click="activeTab = 'tracker'" :class="activeTab === 'tracker' ? 'border-b-2 border-emerald-600 text-emerald-600 font-bold' : 'text-slate-500 hover:text-slate-700'" class="px-5 py-3 transition">
        <i class="fa-solid fa-pen-to-square me-2"></i>記帳與紀錄
      </button>
      <button @click="activeTab = 'pie'" :class="activeTab === 'pie' ? 'border-b-2 border-emerald-600 text-emerald-600 font-bold' : 'text-slate-500 hover:text-slate-700'" class="px-5 py-3 transition">
        <i class="fa-solid fa-chart-pie me-2"></i>單月比例 (圓餅圖)
      </button>
      <button @click="activeTab = 'trend'" :class="activeTab === 'trend' ? 'border-b-2 border-emerald-600 text-emerald-600 font-bold' : 'text-slate-500 hover:text-slate-700'" class="px-5 py-3 transition">
        <i class="fa-solid fa-chart-line me-2"></i>月度走勢 (長條/波浪圖)
      </button>
    </div>

    <!-- Tab 1: 記帳與紀錄清單 -->
    <div x-show="activeTab === 'tracker'" class="space-y-6">
      
      <!-- 記帳表單 -->
      <div class="bg-white p-6 rounded-b-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-4 text-slate-700">新增交易紀錄</h2>
        <form @submit.prevent="addRecord" class="space-y-4">
          
          <!-- 收支類型切換按鈕 -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">收支類型</label>
            <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
              <button type="button" @click="setFormType('expense')" :class="form.type === 'expense' ? 'bg-rose-500 text-white font-bold shadow' : 'text-slate-600'" class="py-2 rounded-lg text-sm transition flex justify-center items-center gap-2">
                <i class="fa-solid fa-arrow-down"></i> 支出 (負數)
              </button>
              <button type="button" @click="setFormType('income')" :class="form.type === 'income' ? 'bg-emerald-500 text-white font-bold shadow' : 'text-slate-600'" class="py-2 rounded-lg text-sm transition flex justify-center items-center gap-2">
                <i class="fa-solid fa-arrow-up"></i> 收入 (正數)
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>
              <input type="date" x-model="form.date" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">分類</label>
              <select x-model="form.category" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                <template x-for="cat in currentCategories" :key="cat">
                  <option :value="cat" x-text="cat"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">金額 ($)</label>
              <input type="number" x-model.number="form.amount" required min="1" placeholder="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">備註</label>
              <input type="text" x-model="form.note" placeholder="例如：薪水、午餐" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
          </div>

          <button type="submit" :disabled="loading" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg hover:bg-emerald-700 transition flex justify-center items-center gap-2">
            <i class="fa-solid fa-plus" x-show="!loading"></i>
            <span x-text="loading ? '儲存中...' : '儲存紀錄'"></span>
          </button>
        </form>
      </div>

      <!-- 交易紀錄清單 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-list-check text-emerald-600"></i>
            <h2 class="text-lg font-bold text-slate-700" x-text="'交易紀錄清單 (共 ' + filteredRecords.length + ' 筆)'"></h2>
          </div>
          
          <div class="flex items-center gap-3 w-full md:w-auto">
            <!-- 搜尋框 -->
            <input type="text" x-model="searchQuery" placeholder="搜尋備註/類別..." class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            <!-- 統計數字 -->
            <div class="text-sm font-semibold flex gap-3">
              <span class="text-emerald-600">收入: <span class="font-bold" x-text="'+$' + totalIncome"></span></span>
              <span class="text-rose-500">支出: <span class="font-bold" x-text="'-$' + totalExpense"></span></span>
            </div>
          </div>
        </div>

        <!-- 明細列表 -->
        <div class="divide-y divide-slate-100">
          <template x-for="item in filteredRecords" :key="item.ID || item.id">
            <div class="py-3 flex justify-between items-center hover:bg-slate-50 px-2 rounded-lg transition">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold" :class="isExpense(item) ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-600'">
                  <i class="fa-solid" :class="isExpense(item) ? 'fa-receipt' : 'fa-sack-dollar'"></i>
                </div>
                <div>
                  <div class="flex items-center space-x-2">
                    <span class="font-bold text-slate-800" x-text="item.類別 || item.category"></span>
                    <span class="text-xs px-2 py-0.5 rounded text-slate-500 bg-slate-100" x-text="formatDateStr(item.日期 || item.date)"></span>
                  </div>
                  <p class="text-xs text-slate-400" x-text="item.備註 || item.note || '無備註'"></p>
                </div>
              </div>

              <div class="flex items-center space-x-4">
                <span class="font-bold text-base" :class="isExpense(item) ? 'text-rose-500' : 'text-emerald-600'" x-text="formatAmount(item)"></span>
                <div class="flex space-x-1 text-slate-400">
                  <button @click="openEditModal(item)" class="p-1.5 hover:text-indigo-600 rounded transition"><i class="fa-solid fa-pen"></i></button>
                  <button @click="deleteRecord(item)" class="p-1.5 hover:text-rose-600 rounded transition"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>
            </div>
          </template>
          
          <template x-if="filteredRecords.length === 0">
            <div class="text-center py-8 text-slate-400">尚無交易紀錄</div>
          </template>
        </div>
      </div>
    </div>

    <!-- Tab 2: 單月大項比例 (圓餅圖) -->
    <div x-show="activeTab === 'pie'" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4" x-init="$watch('activeTab', value => { if(value === 'pie') renderPieChart(); })">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-700">月份類別比例</h2>
        <div class="flex gap-2">
          <select x-model="pieType" @change="renderPieChart()" class="border border-slate-300 px-3 py-1.5 rounded-lg text-sm font-bold text-slate-700 outline-none">
            <option value="expense">支出比例</option>
            <option value="income">收入比例</option>
          </select>
          <select x-model="selectedMonth" @change="renderPieChart()" class="border border-slate-300 px-3 py-1.5 rounded-lg text-sm font-bold text-emerald-600 outline-none">
            <template x-for="m in 12" :key="m">
              <option :value="m" x-text="m + ' 月'"></option>
            </template>
          </select>
        </div>
      </div>
      <div class="max-w-md mx-auto py-4">
        <canvas id="pieChart"></canvas>
      </div>
    </div>

    <!-- Tab 3: 月度走勢 (長條圖 / 波浪圖) -->
    <div x-show="activeTab === 'trend'" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4" x-init="$watch('activeTab', value => { if(value === 'trend') renderTrendChart(); })">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <h2 class="text-lg font-bold text-slate-700" x-text="selectedYear + ' 年支出月度走勢'"></h2>
        <div class="bg-slate-100 p-1 rounded-lg flex text-xs font-bold">
          <button @click="chartType = 'bar'; renderTrendChart()" :class="chartType === 'bar' ? 'bg-white text-emerald-600 shadow' : 'text-slate-500'" class="px-3 py-1.5 rounded-md transition">長條圖</button>
          <button @click="chartType = 'line'; renderTrendChart()" :class="chartType === 'line' ? 'bg-white text-emerald-600 shadow' : 'text-slate-500'" class="px-3 py-1.5 rounded-md transition">波浪圖</button>
        </div>
      </div>
      <div class="w-full py-4 min-h-[350px]">
        <canvas id="trendChart"></canvas>
      </div>
    </div>

  </main>

  <!-- 修改 Modal 彈窗 -->
  <div x-show="showEditModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex justify-center items-center p-4 z-50" x-cloak>
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-lg text-slate-700">編輯交易紀錄</h3>
        <button @click="showEditModal = false" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form @submit.prevent="updateRecord" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>
          <input type="date" x-model="editForm.date" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">金額 ($)</label>
          <input type="number" x-model.number="editForm.amount" required min="1" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">備註</label>
          <input type="text" x-model="editForm.note" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" @click="showEditModal = false" class="w-1/2 py-2 border rounded-lg text-slate-600 font-semibold">取消</button>
          <button type="submit" :disabled="loading" class="w-1/2 py-2 bg-emerald-600 text-white rounded-lg font-semibold hover:bg-emerald-700">更新紀錄</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function appData() {
      return {
        activeTab: 'tracker',
        // 最新部署的 Web App URL
        webAppUrl: 'https://script.google.com/macros/s/AKfycbwxyqVeM-LHKa1dIa2JF9H0xF7xCvhyUdpMdeiyk4JIri4y8qqKKFQ-cRuVmuYQ7w5rLQ/exec',
        selectedYear: new Date().getFullYear().toString(),
        selectedMonth: new Date().getMonth() + 1,
        availableYears: [new Date().getFullYear().toString()],
        searchQuery: '',
        
        incomeCategories: ['薪水', '兼職', '獎金', '紅包', '中獎'],
        expenseCategories: ['飲食', '住家', '交通', '購物', '醫療', '旅遊', 'Pet麻糬', '電信費', '電費', '水費', '瓦斯費', '手續費', '娛樂'],
        
        form: {
          type: 'expense',
          date: new Date().toISOString().split('T')[0],
          category: '飲食',
          amount: '',
          note: ''
        },

        showEditModal: false,
        editForm: { id: '', type: 'expense', date: '', category: '', amount: '', note: '' },

        records: [],
        loading: false,
        pieType: 'expense',
        pieChartInstance: null,
        trendChartInstance: null,
        chartType: 'bar',

        initApp() {
          this.fetchAvailableYears();
          this.loadDataForYear(this.selectedYear);
        },

        // 日期格式化：徹底截取 YYYY-MM-DD，防範 ISO 時區偏置
        formatDateStr(str) {
          if (!str) return '';
          let cleanStr = String(str);
          if (cleanStr.includes('T')) {
            cleanStr = cleanStr.split('T')[0];
          }
          return cleanStr.substring(0, 10);
        },

        get currentCategories() {
          return this.form.type === 'expense' ? this.expenseCategories : this.incomeCategories;
        },

        setFormType(type) {
          this.form.type = type;
          this.form.category = type === 'expense' ? this.expenseCategories[0] : this.incomeCategories[0];
        },

        isExpense(item) {
          const type = item.類型 || item.type;
          const amt = Number(item.金額 || item.amount || 0);
          return type === 'expense' || amt < 0;
        },

        formatAmount(item) {
          const amt = Math.abs(Number(item.金額 || item.amount || 0));
          return (this.isExpense(item) ? '-$' : '+$') + amt.toLocaleString();
        },

        get filteredRecords() {
          if (!this.searchQuery) return this.records;
          const q = this.searchQuery.toLowerCase();
          return this.records.filter(r => 
            (r.類別 || r.category || '').toLowerCase().includes(q) ||
            (r.備註 || r.note || '').toLowerCase().includes(q)
          );
        },

        get totalIncome() {
          return this.records
            .filter(r => !this.isExpense(r))
            .reduce((sum, r) => sum + Math.abs(Number(r.金額 || r.amount || 0)), 0)
            .toLocaleString();
        },

        get totalExpense() {
          return this.records
            .filter(r => this.isExpense(r))
            .reduce((sum, r) => sum + Math.abs(Number(r.金額 || r.amount || 0)), 0)
            .toLocaleString();
        },

        async fetchAvailableYears() {
          try {
            const res = await fetch(`${this.webAppUrl}?action=getYears`);
            const data = await res.json();
            if (data.years && data.years.length > 0) this.availableYears = data.years;
          } catch (e) {
            console.warn('年份載入失敗，使用預設年份', e);
          }
        },

        async loadDataForYear(year) {
          this.selectedYear = year;
          try {
            const res = await fetch(`${this.webAppUrl}?action=getData&year=${year}`);
            const data = await res.json();
            this.records = data.data || [];
          } catch (e) {
            console.error('載入失敗', e);
          }
          if (this.activeTab === 'pie') this.renderPieChart();
          if (this.activeTab === 'trend') this.renderTrendChart();
        },

        async addRecord() {
          if (!this.form.amount || this.form.amount <= 0) return;
          this.loading = true;

          const newItem = {
            action: 'add',
            type: this.form.type,
            date: this.form.date,
            category: this.form.category,
            amount: Number(this.form.amount),
            note: this.form.note
          };

          try {
            await fetch(this.webAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newItem)
            });
          } catch (e) {
            console.error('寫入 API 失敗', e);
          }

          this.form.amount = '';
          this.form.note = '';
          this.loading = false;
          alert('紀錄新增成功！');
          this.loadDataForYear(this.selectedYear);
        },

        openEditModal(item) {
          this.editForm = {
            id: item.ID || item.id,
            type: this.isExpense(item) ? 'expense' : 'income',
            date: this.formatDateStr(item.日期 || item.date),
            category: item.類別 || item.category,
            amount: Math.abs(Number(item.金額 || item.amount || 0)),
            note: item.備註 || item.note || ''
          };
          this.showEditModal = true;
        },

        async updateRecord() {
          this.loading = true;
          try {
            await fetch(this.webAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'update', ...this.editForm })
            });
          } catch (e) {
            console.error('更新失敗', e);
          }
          this.loading = false;
          this.showEditModal = false;
          alert('紀錄已成功更新！');
          this.loadDataForYear(this.selectedYear);
        },

        async deleteRecord(item) {
          if (!confirm('確定要刪除這筆交易紀錄嗎？')) return;
          this.loading = true;
          try {
            await fetch(this.webAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'delete', id: item.ID || item.id, date: item.日期 || item.date })
            });
          } catch (e) {
            console.error('刪除失敗', e);
          }
          this.loading = false;
          alert('已成功刪除該筆紀錄！');
          this.loadDataForYear(this.selectedYear);
        },

        renderPieChart() {
          const targetCategories = this.pieType === 'expense' ? this.expenseCategories : this.incomeCategories;
          const monthFiltered = this.records.filter(r => {
            const dateStr = this.formatDateStr(r.日期 || r.date);
            const parts = dateStr.split('-');
            const recordMonth = parts.length >= 2 ? parseInt(parts[1], 10) : 0;
            return recordMonth === Number(this.selectedMonth) && this.isExpense(r) === (this.pieType === 'expense');
          });

          const catSums = {};
          targetCategories.forEach(c => catSums[c] = 0);
          monthFiltered.forEach(r => {
            const cat = r.類別 || r.category;
            if (catSums[cat] !== undefined) {
              catSums[cat] += Math.abs(Number(r.金額 || r.amount || 0));
            }
          });

          const ctx = document.getElementById('pieChart').getContext('2d');
          if (this.pieChartInstance) this.pieChartInstance.destroy();

          this.pieChartInstance = new Chart(ctx, {
            type: 'pie',
            data: {
              labels: Object.keys(catSums),
              datasets: [{
                data: Object.values(catSums),
                backgroundColor: ['#f87171', '#3b82f6', '#fbbf24', '#34d399', '#a78bfa', '#f472b6', '#9ca3af', '#fb923c', '#4ade80', '#22d3ee', '#818cf8', '#e879f9', '#a3e635']
              }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
          });
        },

        renderTrendChart() {
          const monthLabels = Array.from({ length: 12 }, (_, i) => (i + 1) + '月');
          const colors = ['#f87171', '#3b82f6', '#fbbf24', '#34d399', '#a78bfa', '#f472b6', '#9ca3af', '#fb923c', '#4ade80', '#22d3ee', '#818cf8', '#e879f9', '#a3e635'];

          const datasets = this.expenseCategories.map((cat, idx) => {
            const monthlyData = Array(12).fill(0);
            this.records.forEach(r => {
              if (this.isExpense(r) && (r.類別 || r.category) === cat) {
                const dateStr = this.formatDateStr(r.日期 || r.date);
                const parts = dateStr.split('-');
                if (parts.length >= 2) {
                  const m = parseInt(parts[1], 10) - 1;
                  if (m >= 0 && m < 12) {
                    monthlyData[m] += Math.abs(Number(r.金額 || r.amount || 0));
                  }
                }
              }
            });

            return {
              label: cat,
              data: monthlyData,
              backgroundColor: colors[idx % colors.length],
              borderColor: colors[idx % colors.length],
              tension: 0.4,
              fill: false
            };
          });

          const ctx = document.getElementById('trendChart').getContext('2d');
          if (this.trendChartInstance) this.trendChartInstance.destroy();

          this.trendChartInstance = new Chart(ctx, {
            type: this.chartType,
            data: { labels: monthLabels, datasets: datasets },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: { y: { beginAtZero: true } },
              plugins: { legend: { position: 'bottom' } }
            }
          });
        }
      }
    }
  </script>
</body>
</html>
