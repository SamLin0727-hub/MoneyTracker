<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記帳與財務分析系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12" x-data="appData()" x-init="initApp()">

  <!-- 頂部導覽列 -->
  <header class="bg-emerald-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-wallet text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">個人記帳與財務分析</h1>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-6xl mx-auto px-4 mt-6 space-y-6">

    <!-- 記帳與紀錄 -->
    <div class="space-y-6">
      
      <!-- 記帳表單 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-4 text-slate-700">新增交易紀錄</h2>
        <form @submit.prevent="addRecord" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">收支類型</label>
            <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
              <button type="button" @click="setFormType('expense')" :class="form.type === 'expense' ? 'bg-rose-500 text-white font-bold shadow' : 'text-slate-600'" class="py-2 rounded-lg text-sm transition flex justify-center items-center gap-2">
                <i class="fa-solid fa-arrow-down"></i> 支出 (負數)
              </button>
              <button type="button" @click="setFormType('income')" :class="form.type === 'income' ? 'bg-emerald-500 text-white font-bold shadow' : 'text-slate-600'" class="py-2 rounded-lg text-sm transition flex justify-center items-center gap-2">
                <i class="fa-solid fa-arrow-up"></i> 收入 (正數)
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>
              <input type="date" x-model="form.date" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">分類</label>
              <select x-model="form.category" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                <template x-for="cat in currentCategories" :key="cat">
                  <option :value="cat" x-text="cat"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">金額 ($)</label>
              <input type="number" x-model.number="form.amount" required min="1" placeholder="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">備註</label>
              <input type="text" x-model="form.note" placeholder="例如：薪水、午餐" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
          </div>

          <button type="submit" :disabled="loading" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg hover:bg-emerald-700 transition flex justify-center items-center gap-2">
            <i class="fa-solid fa-plus" x-show="!loading"></i>
            <span x-text="loading ? '儲存中...' : '儲存紀錄'"></span>
          </button>
        </form>
      </div>

      <!-- 紀錄展示區（切換：交易紀錄清單 / 圓餅圖） -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        
        <!-- 上方工具列：子視圖切換 + 年月動態選擇 + 統計資訊 -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-slate-100">
          
          <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
            <!-- 切換按鈕 (Segmented Control) -->
            <div class="bg-slate-100 p-1 rounded-xl flex items-center space-x-1">
              <button @click="switchTrackerSubView('list')" :class="trackerSubView === 'list' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="px-4 py-1.5 rounded-lg text-sm transition flex items-center gap-2">
                <i class="fa-solid fa-list"></i> 交易紀錄清單
              </button>
              <button @click="switchTrackerSubView('pie')" :class="trackerSubView === 'pie' ? 'bg-white text-emerald-600 font-bold shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="px-4 py-1.5 rounded-lg text-sm transition flex items-center gap-2">
                <i class="fa-solid fa-chart-pie"></i> 單月圓餅圖
              </button>
            </div>

            <!-- 動態年月下拉選單 (自動倒序，例：2026/10) -->
            <div class="flex items-center space-x-1 bg-slate-100 px-3 py-1 rounded-xl border border-slate-200">
              <span class="text-xs font-semibold text-slate-500">月份：</span>
              <select x-model="selectedYearMonth" @change="onYearMonthChange()" class="bg-transparent font-bold text-emerald-700 text-sm outline-none cursor-pointer">
                <template x-for="ym in availableYearMonths" :key="ym">
                  <option :value="ym" x-text="formatYearMonthLabel(ym)"></option>
                </template>
              </select>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-4 w-full md:w-auto justify-between md:justify-end">
            <!-- 搜尋框 (僅在清單視圖顯示) -->
            <input x-show="trackerSubView === 'list'" type="text" x-model="searchQuery" placeholder="搜尋備註/類別..." class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">

            <!-- 圓餅圖收支切換 (僅在圓餅圖視圖顯示) -->
            <select x-show="trackerSubView === 'pie'" x-model="pieType" @change="renderPieChart()" class="border border-slate-300 px-3 py-1.5 rounded-lg text-sm font-bold text-slate-700 outline-none">
              <option value="expense">支出比例</option>
              <option value="income">收入比例</option>
            </select>

            <!-- 本月小計 -->
            <div class="text-sm font-semibold flex gap-3">
              <span class="text-emerald-600"><span x-text="formatYearMonthLabel(selectedYearMonth) + '收入:'"></span> <span class="font-bold" x-text="'+$' + monthlyIncome"></span></span>
              <span class="text-rose-500"><span x-text="formatYearMonthLabel(selectedYearMonth) + '支出:'"></span> <span class="font-bold" x-text="'-$' + monthlyExpense"></span></span>
            </div>
          </div>
        </div>

        <!-- 視圖 1：交易紀錄清單 (日期倒序排列) -->
        <div x-show="trackerSubView === 'list'" class="divide-y divide-slate-100">
          <template x-for="item in filteredMonthlyRecords" :key="item.ID || item.id">
            <div class="py-3 flex justify-between items-center hover:bg-slate-50 px-2 rounded-lg transition">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold" :class="isExpense(item) ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-600'">
                  <i class="fa-solid" :class="isExpense(item) ? 'fa-receipt' : 'fa-sack-dollar'"></i>
                </div>
                <div>
                  <div class="flex items-center space-x-2">
                    <span class="font-bold text-slate-800" x-text="item.類別 || item.category"></span>
                    <span class="text-xs px-2 py-0.5 rounded text-slate-500 bg-slate-100" x-text="formatDateStr(item.日期 || item.date)"></span>
                  </div>
                  <p class="text-xs text-slate-400" x-text="item.備註 || item.note || '無備註'"></p>
                </div>
              </div>

              <div class="flex items-center space-x-4">
                <span class="font-bold text-base" :class="isExpense(item) ? 'text-rose-500' : 'text-emerald-600'" x-text="formatAmount(item)"></span>
                <div class="flex space-x-1 text-slate-400">
                  <button @click="openEditModal(item)" class="p-1.5 hover:text-indigo-600 rounded transition"><i class="fa-solid fa-pen"></i></button>
                  <button @click="deleteRecord(item)" class="p-1.5 hover:text-rose-600 rounded transition"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>
            </div>
          </template>
          
          <template x-if="filteredMonthlyRecords.length === 0">
            <div class="text-center py-8 text-slate-400" x-text="formatYearMonthLabel(selectedYearMonth) + ' 無符合條件的交易紀錄'"></div>
          </template>
        </div>

        <!-- 視圖 2：單月圓餅圖 -->
        <div x-show="trackerSubView === 'pie'" class="max-w-md mx-auto py-4">
          <canvas id="pieChart"></canvas>
        </div>

      </div>
    </div>

  </main>

  <!-- 修改 Modal 彈窗 -->
  <div x-show="showEditModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex justify-center items-center p-4 z-50" x-cloak>
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-lg text-slate-700">編輯交易紀錄</h3>
        <button @click="showEditModal = false" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form @submit.prevent="updateRecord" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">日期</label>
          <input type="date" x-model="editForm.date" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">金額 ($)</label>
          <input type="number" x-model.number="editForm.amount" required min="1" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">備註</label>
          <input type="text" x-model="editForm.note" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" @click="showEditModal = false" class="w-1/2 py-2 border rounded-lg text-slate-600 font-semibold">取消</button>
          <button type="submit" :disabled="loading" class="w-1/2 py-2 bg-emerald-600 text-white rounded-lg font-semibold hover:bg-emerald-700">更新紀錄</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function appData() {
      return {
        trackerSubView: 'list', // 'list' | 'pie'
        webAppUrl: 'https://script.google.com/macros/s/AKfycbwxyqVeM-LHKa1dIa2JF9H0xF7xCvhyUdpMdeiyk4JIri4y8qqKKFQ-cRuVmuYQ7w5rLQ/exec',
        selectedYear: new Date().getFullYear().toString(),
        selectedYearMonth: '', // 格式例如: '2026-10'
        searchQuery: '',
        
        incomeCategories: ['薪水', '兼職', '獎金', '紅包', '中獎'],
        expenseCategories: ['飲食', '住家', '交通', '購物', '醫療', '旅遊', 'Pet麻糬', '電信費', '電費', '水費', '瓦斯費', '手續費', '娛樂'],
        
        form: {
          type: 'expense',
          date: new Date().toISOString().split('T')[0],
          category: '飲食',
          amount: '',
          note: ''
        },

        showEditModal: false,
        editForm: { id: '', type: 'expense', date: '', category: '', amount: '', note: '' },

        records: [],
        loading: false,
        pieType: 'expense',
        pieChartInstance: null,

        initApp() {
          this.loadDataForYear(this.selectedYear);
        },

        formatDateStr(str) {
          if (!str) return '';
          let cleanStr = String(str);
          if (cleanStr.includes('T')) {
            cleanStr = cleanStr.split('T')[0];
          }
          return cleanStr.substring(0, 10);
        },

        formatYearMonthLabel(ymStr) {
          if (!ymStr) return '';
          const parts = ymStr.split('-');
          if (parts.length < 2) return ymStr;
          return `${parts[0]}年${parseInt(parts[1], 10)}月`;
        },

        get currentCategories() {
          return this.form.type === 'expense' ? this.expenseCategories : this.incomeCategories;
        },

        setFormType(type) {
          this.form.type = type;
          this.form.category = type === 'expense' ? this.expenseCategories[0] : this.incomeCategories[0];
        },

        isExpense(item) {
          const type = item.類型 || item.type;
          const amt = Number(item.金額 || item.amount || 0);
          return type === 'expense' || amt < 0;
        },

        formatAmount(item) {
          const amt = Math.abs(Number(item.金額 || item.amount || 0));
          return (this.isExpense(item) ? '-$' : '+$') + amt.toLocaleString();
        },

        // 自動從紀錄中擷取有資料的「年月」（例如 '2026-10'），並按最新日期降序排序
        get availableYearMonths() {
          const ymSet = new Set();
          
          this.records.forEach(r => {
            const dateStr = this.formatDateStr(r.日期 || r.date);
            if (dateStr && dateStr.length >= 7) {
              ymSet.add(dateStr.substring(0, 7)); // 取前 7 碼 YYYY-MM
            }
          });

          // 若完全沒資料，預設放入當月
          if (ymSet.size === 0) {
            const now = new Date();
            const currentYM = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            ymSet.add(currentYM);
          }

          // 降序排序（倒序）：最新的年月在前面
          return Array.from(ymSet).sort((a, b) => b.localeCompare(a));
        },

        // 依據選取的特定年月篩選，並依據日期降序（倒序）排列
        get monthlyRecords() {
          if (!this.selectedYearMonth) return [];

          return this.records.filter(r => {
            const dateStr = this.formatDateStr(r.日期 || r.date);
            return dateStr.startsWith(this.selectedYearMonth);
          }).sort((a, b) => {
            const dateA = this.formatDateStr(a.日期 || a.date);
            const dateB = this.formatDateStr(b.日期 || b.date);
            if (dateA !== dateB) {
              return dateB.localeCompare(dateA); // 日期大 (新) 的在前面
            }
            return (b.ID || b.id || 0) - (a.ID || a.id || 0);
          });
        },

        // 清單搜尋過濾
        get filteredMonthlyRecords() {
          if (!this.searchQuery) return this.monthlyRecords;
          const q = this.searchQuery.toLowerCase();
          return this.monthlyRecords.filter(r => 
            (r.類別 || r.category || '').toLowerCase().includes(q) ||
            (r.備註 || r.note || '').toLowerCase().includes(q)
          );
        },

        get monthlyIncome() {
          return this.monthlyRecords
            .filter(r => !this.isExpense(r))
            .reduce((sum, r) => sum + Math.abs(Number(r.金額 || r.amount || 0)), 0)
            .toLocaleString();
        },

        get monthlyExpense() {
          return this.monthlyRecords
            .filter(r => this.isExpense(r))
            .reduce((sum, r) => sum + Math.abs(Number(r.金額 || r.amount || 0)), 0)
            .toLocaleString();
        },

        async loadDataForYear(year) {
          this.selectedYear = year;
          try {
            const res = await fetch(`${this.webAppUrl}?action=getData&year=${year}`);
            const data = await res.json();
            this.records = data.data || [];
          } catch (e) {
            console.error('載入失敗', e);
          }

          // 載入資料後，預設選擇最新的有資料年月
          if (this.availableYearMonths.length > 0) {
            if (!this.selectedYearMonth || !this.availableYearMonths.includes(this.selectedYearMonth)) {
              this.selectedYearMonth = this.availableYearMonths[0];
            }
          }

          this.refreshCurrentView();
        },

        onYearMonthChange() {
          this.refreshCurrentView();
        },

        switchTrackerSubView(view) {
          this.trackerSubView = view;
          if (view === 'pie') {
            this.$nextTick(() => this.renderPieChart());
          }
        },

        refreshCurrentView() {
          if (this.trackerSubView === 'pie') {
            this.$nextTick(() => this.renderPieChart());
          }
        },

        async addRecord() {
          if (!this.form.amount || this.form.amount <= 0) return;
          this.loading = true;

          const addedDateYM = this.form.date.substring(0, 7);

          const newItem = {
            action: 'add',
            type: this.form.type,
            date: this.form.date,
            category: this.form.category,
            amount: Number(this.form.amount),
            note: this.form.note
          };

          try {
            await fetch(this.webAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newItem)
            });
          } catch (e) {
            console.error('寫入 API 失敗', e);
          }

          this.form.amount = '';
          this.form.note = '';
          this.loading = false;
          
          this.selectedYearMonth = addedDateYM;

          alert('紀錄新增成功！');
          await this.loadDataForYear(this.selectedYear);
        },

        openEditModal(item) {
          this.editForm = {
            id: item.ID || item.id,
            type: this.isExpense(item) ? 'expense' : 'income',
            date: this.formatDateStr(item.日期 || item.date),
            category: item.類別 || item.category,
            amount: Math.abs(Number(item.金額 || item.amount || 0)),
            note: item.備註 || item.note || ''
          };
          this.showEditModal = true;
        },

        async updateRecord() {
          this.loading = true;
          try {
            await fetch(this.webAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'update', ...this.editForm })
            });
          } catch (e) {
            console.error('更新失敗', e);
          }
          this.loading = false;
          this.showEditModal = false;
          alert('紀錄已成功更新！');
          await this.loadDataForYear(this.selectedYear);
        },

        async deleteRecord(item) {
          if (!confirm('確定要刪除這筆交易紀錄嗎？')) return;
          this.loading = true;
          try {
            await fetch(this.webAppUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'delete', id: item.ID || item.id, date: item.日期 || item.date })
            });
          } catch (e) {
            console.error('刪除失敗', e);
          }
          this.loading = false;
          alert('已成功刪除該筆紀錄！');
          await this.loadDataForYear(this.selectedYear);
        },

        renderPieChart() {
          const canvasEl = document.getElementById('pieChart');
          if (!canvasEl) return;

          const targetCategories = this.pieType === 'expense' ? this.expenseCategories : this.incomeCategories;
          const isExpTarget = this.pieType === 'expense';

          const catSums = {};
          targetCategories.forEach(c => catSums[c] = 0);

          this.monthlyRecords.forEach(r => {
            if (this.isExpense(r) === isExpTarget) {
              const cat = r.類別 || r.category;
              if (catSums[cat] !== undefined) {
                catSums[cat] += Math.abs(Number(r.金額 || r.amount || 0));
              }
            }
          });

          const labels = Object.keys(catSums);
          const dataValues = Object.values(catSums);

          if (this.pieChartInstance) {
            this.pieChartInstance.data.labels = labels;
            this.pieChartInstance.data.datasets[0].data = dataValues;
            this.pieChartInstance.update();
          } else {
            const ctx = canvasEl.getContext('2d');
            this.pieChartInstance = new Chart(ctx, {
              type: 'pie',
              data: {
                labels: labels,
                datasets: [{
                  data: dataValues,
                  backgroundColor: ['#f87171', '#3b82f6', '#fbbf24', '#34d399', '#a78bfa', '#f472b6', '#9ca3af', '#fb923c', '#4ade80', '#22d3ee', '#818cf8', '#e879f9', '#a3e635']
                }]
              },
              options: { 
                responsive: true, 
                animation: { duration: 300 },
                plugins: { legend: { position: 'bottom' } } 
              }
            });
          }
        }
      }
    }
  </script>
</body>
</html>
